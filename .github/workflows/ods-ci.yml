name: ODS CI

on:
  push:
    paths:
      - 'subprojects/ODS/**'
      - 'docs/subprojects/ods/**'
      - '.github/workflows/ods-ci.yml'
  pull_request:
    paths:
      - 'subprojects/ODS/**'
      - 'docs/subprojects/ods/**'
      - '.github/workflows/ods-ci.yml'

jobs:
  upstream-contract:
    name: Verify pinned ODS upstream
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout LEONES with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Verify canonical upstream and pinned SHA
        working-directory: subprojects/ODS
        run: |
          set -euo pipefail
          expected='5a4450765976e2ad2792b9ac8927f4873dac60f6'
          actual="$(git rev-parse HEAD)"
          remote="$(git remote get-url origin)"
          test "$actual" = "$expected"
          case "$remote" in
            https://github.com/Osmantic/ODS.git|git@github.com:Osmantic/ODS.git) ;;
            *) echo "Unexpected ODS remote: $remote"; exit 1 ;;
          esac
          test -f README.md
          test -f ods/install.sh
          echo "ODS upstream: $remote"
          echo "ODS pinned SHA: $actual"

      - name: Syntax-check upstream installer entrypoint
        run: bash -n subprojects/ODS/ods/install.sh

      - name: Confirm no historical Python OpenDeepSearch tree is being used
        working-directory: subprojects/ODS
        run: |
          set -euo pipefail
          test ! -d src/opendeepsearch
          test ! -d opendeepsearch
          echo "No historical opendeepsearch tree present; ODS remains the official Osmantic stack."

  upstream-diagnostics:
    name: Upstream diagnostics
    needs: upstream-contract
    if: ${{ always() }}
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - name: Checkout LEONES with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Inspect upstream structure
        working-directory: subprojects/ODS
        run: |
          set -u
          echo '=== ODS root ==='
          find . -maxdepth 2 -type f | sort | head -200
          echo
          echo '=== Installer entrypoint ==='
          sed -n '1,180p' ods/install.sh
          echo
          echo '=== Git provenance ==='
          git remote -v
          git rev-parse HEAD
