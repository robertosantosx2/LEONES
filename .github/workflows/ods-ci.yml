name: ODS CI

on:
  push:
    paths:
      - 'docs/subprojects/ods/**'
      - '.github/workflows/ods-ci.yml'
  pull_request:
    paths:
      - 'docs/subprojects/ods/**'
      - '.github/workflows/ods-ci.yml'

jobs:
  contract:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU test stack
        working-directory: docs/subprojects/ods/upstream
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install loguru nest-asyncio python-dotenv requests langchain-text-splitters
          python -m pip install -e . --no-deps
      - name: Import contract
        working-directory: docs/subprojects/ods/upstream
        run: |
          python - <<'PY'
          import opendeepsearch
          from opendeepsearch.ranking_models.base_reranker import BaseSemanticSearcher
          from opendeepsearch.ranking_models.infinity_rerank import InfinitySemanticSearcher
          from opendeepsearch.ranking_models.jina_reranker import JinaReranker
          print('ODS imports: OK')
          print(BaseSemanticSearcher, InfinitySemanticSearcher, JinaReranker)
          PY
      - name: Run upstream tests
        working-directory: docs/subprojects/ods/upstream
        run: pytest -q tests
