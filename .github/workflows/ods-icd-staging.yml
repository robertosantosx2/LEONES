name: ODS ICD staging contracts

on:
  push:
    branches:
      - ods-cafe-llama-icd-dashboard
  pull_request:
    branches:
      - ods-evolution
      - main
    paths:
      - "integrations/ods-icd-staging/**"
      - ".github/workflows/ods-icd-staging.yml"

jobs:
  backend-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated staging test dependencies
        run: python -m pip install --upgrade pytest "fastapi>=0.115,<1" "httpx>=0.27,<0.29" aiohttp
      - name: Compile staged ICD backend modules
        run: |
          python -m py_compile \
            integrations/ods-icd-staging/ods/extensions/services/dashboard-api/inference_configuration.py \
            integrations/ods-icd-staging/ods/extensions/services/dashboard-api/cafe_llama_icd.py \
            integrations/ods-icd-staging/ods/extensions/services/dashboard-api/helpers.py \
            integrations/ods-icd-staging/ods/extensions/services/dashboard-api/main.py \
            integrations/ods-icd-staging/ods/extensions/services/dashboard-api/routers/inference_configurations.py \
            integrations/ods-icd-staging/ods/extensions/services/dashboard-api/routers/models.py
      - name: Run staged ICD API contract tests
        run: pytest -q integrations/ods-icd-staging/tests/test_inference_configuration_routes.py
      - name: Run exact configuration/workload evidence store tests
        run: pytest -q integrations/ods-icd-staging/tests/test_inference_configuration_evidence.py

  dashboard-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: robertosantosx2/ODS
          ref: feat/cafe-llama-icd-runtime-profile
          path: ods-src
      - uses: actions/checkout@v4
        with:
          repository: robertosantosx2/ODS
          ref: feat/dashboard-i18n-es-zh
          path: ods-i18n
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Overlay staged ICD Dashboard files
        run: |
          cp integrations/ods-icd-staging/ods/extensions/services/dashboard/src/pages/Models.jsx ods-src/ods/extensions/services/dashboard/src/pages/Models.jsx
          cp integrations/ods-icd-staging/ods/extensions/services/dashboard/src/hooks/useModels.js ods-src/ods/extensions/services/dashboard/src/hooks/useModels.js
          cp integrations/ods-icd-staging/ods/extensions/services/dashboard/src/hooks/useInferenceConfigurations.js ods-src/ods/extensions/services/dashboard/src/hooks/useInferenceConfigurations.js
          mkdir -p ods-src/ods/extensions/services/dashboard/src/components/models
          cp integrations/ods-icd-staging/ods/extensions/services/dashboard/src/components/models/InferenceConfigurationPanel.jsx ods-src/ods/extensions/services/dashboard/src/components/models/
          cp integrations/ods-icd-staging/ods/extensions/services/dashboard/src/components/models/InferenceConfigurationPanel.test.jsx ods-src/ods/extensions/services/dashboard/src/components/models/
          cp integrations/ods-icd-staging/ods/extensions/services/dashboard/src/components/models/inference-configuration-panel.css ods-src/ods/extensions/services/dashboard/src/components/models/
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          source = Path("integrations/ods-icd-staging/ods/extensions/services/dashboard/src/i18n")
          target = Path("ods-src/ods/extensions/services/dashboard/src/i18n")
          locales = {"en": "en.js", "es": "es.js", "zh-CN": "zh-CN.js"}
          for locale, filename in locales.items():
              additions = json.loads((source / f"inferenceConfiguration.{locale}.json").read_text())
              path = target / filename
              text = path.read_text()
              explicit_keys = set(re.findall(r"^\\s*['\\\"]([^'\\\"]+)['\\\"]\\s*:", text, flags=re.MULTILINE))
              lines = []
              for key, value in additions.items():
                  if key in explicit_keys:
                      # Never overwrite concurrent locale work; an existing key
                      # must be reviewed manually if it differs.
                      match = re.search(r"^\\s*['\\\"]" + re.escape(key) + r"['\\\"]\\s*:\\s*(['\\\"])(.*?)\\1\\s*,?\\s*$", text, flags=re.MULTILINE)
                      if match:
                          existing = match.group(2).replace("\\\\'", "'")
                          if existing != value:
                              raise SystemExit(f"Translation collision in {filename}: {key}")
                      continue
                  lines.append("  " + json.dumps(key, ensure_ascii=False) + ": " + json.dumps(value, ensure_ascii=False) + ",")
              if lines:
                  closing = text.rfind("}")
                  if closing < 0:
                      raise SystemExit(f"Cannot find object terminator in {path}")
                  text = text[:closing] + "\\n  // cafe-llama ICD strings merged by key; existing translations preserved.\\n" + "\\n".join(lines) + "\\n" + text[closing:]
                  path.write_text(text)
          PY
      - name: Install Dashboard dependencies
        working-directory: ods-src/ods/extensions/services/dashboard
        run: npm ci
      - name: Test staged ICD Dashboard panel
        working-directory: ods-src/ods/extensions/services/dashboard
        run: npm test -- src/components/models/InferenceConfigurationPanel.test.jsx
      - name: Build Dashboard with staged ICD panel
        working-directory: ods-src/ods/extensions/services/dashboard
        run: npm run build
