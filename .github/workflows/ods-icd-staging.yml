name: ODS ICD staging contracts

on:
  push:
    branches:
      - ods-cafe-llama-icd-dashboard
  pull_request:
    branches:
      - ods-evolution
      - main
    paths:
      - "integrations/ods-icd-staging/**"
      - ".github/workflows/ods-icd-staging.yml"

jobs:
  cafe-artifact-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: robertosantosx2/ODS
          ref: feat/cafe-llama-runtime-improvements
          path: ods-src
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated patcher test dependency
        run: python -m pip install --upgrade pytest
      - name: Apply fail-closed hardening patch to disposable candidate checkout
        run: python integrations/ods-icd-staging/scripts/harden_cafe_artifact.py
      - name: Verify patcher transforms real candidate and fails closed on moved anchors
        run: pytest -q integrations/ods-icd-staging/tests/test_cafe_artifact_patcher.py integrations/ods-icd-staging/tests/test_cafe_artifact_hardening.py
      - name: Verify resulting pinned artifact contract
        run: |
          grep -F 'sha256sum -c -' ods-src/ods/extensions/library/services/cafe-llama/Dockerfile
          grep -F 'CAFE_LLAMA_RELEASE_SHA256: ${CAFE_LLAMA_RELEASE_SHA256:-536ec49ec1de5277578be976a5c161bb985857d5f8066e74889afff6c3f5920c}' ods-src/ods/extensions/library/services/cafe-llama/compose.yaml
          grep -F 'https://github.com/quimmedes/cafe-llama.cpp/releases/download/0.75/llama-0.75-bin-linux-cuda-12.4-x64.tar.gz' ods-src/ods/extensions/library/services/cafe-llama/compose.yaml
          grep -F '/usr/local/bin/llama-server --version' ods-src/ods/extensions/library/services/cafe-llama/Dockerfile
          grep -F 'org.osmantic.cafe.artifact-sha256="${CAFE_LLAMA_RELEASE_SHA256}"' ods-src/ods/extensions/library/services/cafe-llama/Dockerfile
          grep -F 'CAFE_LLAMA_BUILD_ID: ${CAFE_LLAMA_BUILD_ID:-cafe-llama-0.75-linux-x64-cuda12.4}' ods-src/ods/extensions/library/services/cafe-llama/compose.yaml
      - name: Build the pinned cafe image and execute the bundled server version check
        run: |
          docker build --pull \
            --file ods-src/ods/extensions/library/services/cafe-llama/Dockerfile \
            --tag ods-cafe-llama:ci \
            ods-src/ods/extensions/library/services/cafe-llama
          docker run --rm --entrypoint /usr/local/bin/llama-server ods-cafe-llama:ci --version
          docker image inspect ods-cafe-llama:ci --format '{{ index .Config.Labels "org.osmantic.cafe.artifact-sha256" }}' | grep -Fx '536ec49ec1de5277578be976a5c161bb985857d5f8066e74889afff6c3f5920c'

  backend-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Osmantic/ODS
          ref: main
          path: ods-src
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated staging test dependencies
        run: python -m pip install --upgrade pytest "fastapi>=0.115,<1" "httpx>=0.27,<0.29" aiohttp
      - name: Compile staged ICD backend modules
        run: |
          python -m py_compile \
            integrations/ods-icd-staging/ods/extensions/services/dashboard-api/inference_configuration.py \
            integrations/ods-icd-staging/ods/extensions/services/dashboard-api/cafe_llama_icd.py \
            integrations/ods-icd-staging/ods/extensions/services/dashboard-api/runtime_selection.py \
            integrations/ods-icd-staging/ods/extensions/services/dashboard-api/helpers.py \
            integrations/ods-icd-staging/ods/extensions/services/dashboard-api/main.py \
            integrations/ods-icd-staging/ods/extensions/services/dashboard-api/routers/inference_configurations.py \
            integrations/ods-icd-staging/ods/extensions/services/dashboard-api/routers/models.py
      - name: Run staged ICD API contract tests
        run: pytest -q integrations/ods-icd-staging/tests/test_inference_configuration_routes.py
      - name: Run explicit runtime selection contract tests
        run: pytest -q integrations/ods-icd-staging/tests/test_runtime_selection.py
      - name: Apply reviewed cafe switchboard delta to current ODS main
        run: |
          python integrations/ods-icd-staging/scripts/apply_cafe_switchboard_overlay.py
          cp integrations/ods-icd-staging/ods/bin/model_switchboard/cafe_adapter.py ods-src/ods/bin/model_switchboard/cafe_adapter.py
      - name: Apply explicit cafe host-agent activation overlay and compile
        run: |
          python -m py_compile integrations/ods-icd-staging/scripts/apply_cafe_host_activation_overlay.py
          python integrations/ods-icd-staging/scripts/apply_cafe_host_activation_overlay.py
          python -m py_compile ods-src/ods/bin/ods-host-agent.py
      - name: Test cafe artifact and running-build provenance against ODS adapter contract
        env:
          PYTHONPATH: ods-src/ods/bin
        run: pytest -q integrations/ods-icd-staging/tests/test_cafe_adapter.py integrations/ods-icd-staging/tests/test_cafe_state_contract.py integrations/ods-icd-staging/tests/test_cafe_artifact_hardening.py integrations/ods-icd-staging/tests/test_cafe_host_overlay_contract.py
      - name: Run exact configuration/workload evidence store tests
        run: pytest -q integrations/ods-icd-staging/tests/test_inference_configuration_evidence.py

  dashboard-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Osmantic/ODS
          ref: main
          path: ods-src
      - uses: actions/checkout@v4
        with:
          repository: robertosantosx2/ODS
          ref: feat/dashboard-i18n-es-zh
          path: ods-i18n
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Overlay staged ICD Dashboard files
        run: |
          cp integrations/ods-icd-staging/ods/extensions/services/dashboard/src/pages/Models.jsx ods-src/ods/extensions/services/dashboard/src/pages/Models.jsx
          cp integrations/ods-icd-staging/ods/extensions/services/dashboard/src/hooks/useModels.js ods-src/ods/extensions/services/dashboard/src/hooks/useModels.js
          cp integrations/ods-icd-staging/ods/extensions/services/dashboard/src/hooks/useInferenceConfigurations.js ods-src/ods/extensions/services/dashboard/src/hooks/useInferenceConfigurations.js
          mkdir -p ods-src/ods/extensions/services/dashboard/src/components/models
          cp integrations/ods-icd-staging/ods/extensions/services/dashboard/src/components/models/InferenceConfigurationPanel.jsx ods-src/ods/extensions/services/dashboard/src/components/models/
          cp integrations/ods-icd-staging/ods/extensions/services/dashboard/src/components/models/InferenceConfigurationPanel.test.jsx ods-src/ods/extensions/services/dashboard/src/components/models/
          cp integrations/ods-icd-staging/ods/extensions/services/dashboard/src/components/models/inference-configuration-panel.css ods-src/ods/extensions/services/dashboard/src/components/models/
          python - <<'PY'
          import json
          import re
          import shutil
          from pathlib import Path

          source = Path("integrations/ods-icd-staging/ods/extensions/services/dashboard/src/i18n")
          upstream_i18n = Path("ods-i18n/ods/extensions/services/dashboard/src/i18n")
          target = Path("ods-src/ods/extensions/services/dashboard/src/i18n")
          target.mkdir(parents=True, exist_ok=True)
          # Supply the shared i18n entrypoint/tests only when the target branch lacks them.
          for support_file in ("index.js", "index.test.js"):
              destination = target / support_file
              seed = upstream_i18n / support_file
              if not destination.exists() and seed.exists():
                  shutil.copy2(seed, destination)
          locales = {"en": "en.js", "es": "es.js", "zh-CN": "zh-CN.js"}
          for locale, filename in locales.items():
              additions = json.loads((source / f"inferenceConfiguration.{locale}.json").read_text())
              path = target / filename
              # Seed only missing files from the current locale branch. Existing
              # target files are never replaced with another branch's copy.
              if not path.exists():
                  seed = upstream_i18n / filename
                  if not seed.exists():
                      raise SystemExit(f"Missing canonical locale file: {seed}")
                  shutil.copy2(seed, path)
              text = path.read_text()
              explicit_keys = set(re.findall(r"""^\s*['"]([^'"]+)['"]\s*:""", text, flags=re.MULTILINE))
              collisions = explicit_keys.intersection(additions)
              if collisions:
                  raise SystemExit(f"Translation keys already exist in {filename}; merge requires review: {sorted(collisions)}")
              lines = [
                  "  " + json.dumps(key, ensure_ascii=False) + ": " + json.dumps(value, ensure_ascii=False) + ","
                  for key, value in additions.items()
              ]
              closing = text.rfind("}")
              if closing < 0:
                  raise SystemExit(f"Cannot find object terminator in {path}")
              text = text[:closing] + "\n  // cafe-llama ICD strings merged by key; existing translations preserved.\n" + "\n".join(lines) + "\n" + text[closing:]
              path.write_text(text)
          PY
      - name: Install Dashboard dependencies
        working-directory: ods-src/ods/extensions/services/dashboard
        run: npm ci
      - name: Test staged ICD Dashboard panel
        working-directory: ods-src/ods/extensions/services/dashboard
        run: npm test -- src/components/models/InferenceConfigurationPanel.test.jsx
      - name: Build Dashboard with staged ICD panel
        working-directory: ods-src/ods/extensions/services/dashboard
        run: npm run build
