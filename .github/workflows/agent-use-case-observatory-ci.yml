name: Markdown Observatory CI
on:
  pull_request:
    paths:
      - 'scripts/prospection/**'
      - 'scripts/research/**'
      - 'scripts/research_catalog/**'
      - 'data/observatory/**'
      - 'web/*.md'
      - 'web/*.html'
      - 'docs/subprojects/AGENT-USE-CASE-OBSERVATORY/**'
      - '.github/workflows/**'
      - 'README.md'
permissions:
  contents: read
concurrency:
  group: markdown-observatory-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Compile observatory generators
        run: |
          python -m py_compile scripts/prospection/build_markdown_observatories.py
          python -m py_compile scripts/prospection/agent_use_case_observatory.py
          python -m py_compile scripts/research/mobile_llms_arm.py
          python -m py_compile scripts/research_catalog/build_research_catalog.py
      - name: Validate internal source feeds
        run: |
          python -m json.tool data/observatory/prospeccion.json >/dev/null
          python -m json.tool data/observatory/agent-use-cases.json >/dev/null
          python -m json.tool data/observatory/mobile-llms-arm.json >/dev/null
          python -m json.tool data/observatory/research-projects.json >/dev/null
      - name: Rebuild Markdown observatories deterministically
        run: |
          python scripts/prospection/build_markdown_observatories.py
          git diff --exit-code -- web/observatory.md web/prospeccion.md web/discovery-atlas.md web/agent-use-cases.md web/mobile-llms-arm.md web/investigacion.md
      - name: Enforce Markdown-only public observatory
        run: |
          test -f web/observatory.md
          test -f web/prospeccion.md
          test -f web/discovery-atlas.md
          test -f web/agent-use-cases.md
          test -f web/mobile-llms-arm.md
          test -f web/investigacion.md
          test ! -e web/prospeccion.html
          test ! -e web/discovery-atlas.html
          test ! -e web/agent-use-cases.html
          test ! -e web/mobile-llms-arm.html
          test ! -e web/investigacion.html
          ! grep -R -nE 'web/(discovery-atlas|agent-use-cases|mobile-llms-arm|investigacion)\\.html|web/data/(prospeccion|agent-use-cases|mobile-llms-arm|research-projects)\\.json' README.md docs web/index.html scripts
          git diff --check
