name: Publish LEONES Web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'assets/**'
      - 'results/**'
      - 'docs/RC2-*.md'
      - 'scripts/rc2_wizard.py'
      - 'README.md'
      - 'INSTALL.md'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: ["Daily OSI Prospection"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          rm -rf _site
          mkdir -p _site
          cp -a web/. _site/
          if [ -d results ]; then cp -a results _site/results; fi
          if [ -d assets ]; then cp -a assets _site/assets; fi

          # Publish beta documentation/source at stable project-site paths.
          mkdir -p _site/docs _site/scripts
          cp docs/RC2-*.md _site/docs/
          cp scripts/rc2_wizard.py _site/scripts/
          cp README.md _site/README.md
          cp INSTALL.md _site/INSTALL.md

          # Raw .md files must remain static files on GitHub Pages.
          touch _site/.nojekyll

      - name: Verify RC2 publication payload
        run: |
          set -e
          test -f _site/INSTALL.md
          test -f _site/docs/RC2-INSTALLATION-MANUAL.md
          test -f _site/docs/RC2-USER-MANUAL.md
          test -f _site/docs/RC2-BETA-USER-FLOW.md
          test -f _site/rc2.html
          test -f _site/scripts/rc2_wizard.py
          test -f _site/README.md
          test -f _site/.nojekyll
          echo "RC2 publication payload verified:"
          printf '%s\n' \
            '/INSTALL.md' \
            '/docs/RC2-USER-MANUAL.md' \
            '/docs/RC2-INSTALLATION-MANUAL.md'

      - name: Verify prospection data is included
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('_site/data/prospeccion.json')
          if not p.is_file():
              print('WARNING: prospeccion.json is not present; continuing publication.')
          else:
              d = json.loads(p.read_text(encoding='utf-8'))
              items = d.get('items')
              if not isinstance(items, list):
                  raise SystemExit('prospeccion.json exists but has no items list')
              print(f"Prospection data verified: {len(items)} candidates; generated_at={d.get('generated_at')}")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
