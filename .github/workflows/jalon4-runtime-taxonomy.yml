name: JALON 4 runtime taxonomy

on:
  push:
    branches: [jalon4-runtime-taxonomy-selection-v1]
  pull_request:
    branches: [main, jalon4-runtime-taxonomy-selection-v1]

jobs:
  taxonomy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Validate schemas and registry
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.runtime_registry import registry_entries
          for p in [Path('schemas/runtime-selection.v1.schema.json'), Path('schemas/runtime-selection.v1.1.schema.json')]:
              json.loads(p.read_text(encoding='utf-8'))
              print('VALID', p)
          entries = registry_entries()
          assert len(entries) == 11
          assert all(e.deployment_class and e.serving_profiles for e in entries.values())
          print('VALID runtime taxonomy:', len(entries))
          PY
      - name: Run JALON 4 tests
        run: python -m pytest tests/test_jalon4_runtime_taxonomy.py -q
      - name: Check whitespace
        run: git diff --check
