name: Benchmark measurement

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Runtime benchmark command"
        required: true
        type: string
      pattern:
        description: "Regex whose first capture group is tok/s"
        required: true
        type: string
      model:
        description: "Model identifier"
        required: true
        type: string
      variant:
        description: "Model variant"
        required: true
        type: string
      runtime:
        description: "Runtime name"
        required: true
        type: string
      hardware:
        description: "Hardware profile"
        required: true
        type: string
      workload:
        description: "Workload name"
        required: true
        type: string
      quantization:
        description: "Quantization"
        required: true
        type: string
      context_tokens:
        description: "Context length"
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: leones-main-writers
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run benchmark and record measurement
        env:
          BENCHMARK_COMMAND: ${{ inputs.command }}
          BENCHMARK_PATTERN: ${{ inputs.pattern }}
        run: |
          python scripts/run_and_record_benchmark.py \
            --pattern "$BENCHMARK_PATTERN" \
            --model "${{ inputs.model }}" \
            --variant "${{ inputs.variant }}" \
            --runtime "${{ inputs.runtime }}" \
            --hardware "${{ inputs.hardware }}" \
            --workload "${{ inputs.workload }}" \
            --quantization "${{ inputs.quantization }}" \
            --context-tokens "${{ inputs.context_tokens }}" \
            bash -lc "$BENCHMARK_COMMAND"
