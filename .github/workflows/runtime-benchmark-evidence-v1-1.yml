name: Runtime benchmark evidence v1.1 contract

on:
  pull_request:
    paths:
      - 'scripts/runtime_benchmark_evidence.py'
      - 'schemas/runtime-benchmark-evidence.v1.1.json'
      - 'tests/test_runtime_benchmark_evidence_v1_1.py'
      - '.github/workflows/runtime-benchmark-evidence-v1-1.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/runtime_benchmark_evidence.py'
      - 'schemas/runtime-benchmark-evidence.v1.1.json'
      - 'tests/test_runtime_benchmark_evidence_v1_1.py'
      - '.github/workflows/runtime-benchmark-evidence-v1-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest
      - name: Compile harness and tests
        run: |
          python -m py_compile scripts/runtime_benchmark_evidence.py tests/test_runtime_benchmark_evidence_v1_1.py
      - name: Validate schema JSON
        run: python -c "import json; json.load(open('schemas/runtime-benchmark-evidence.v1.1.json', encoding='utf-8'))"
      - name: Run v1.1 contract tests
        run: python -m pytest tests/test_runtime_benchmark_evidence_v1_1.py -q
