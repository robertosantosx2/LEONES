name: Daily Atlas Prospection

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/prospection/sources_registry.json'
      - 'scripts/prospection/**'
      - '.github/workflows/daily-prospection.yml'

permissions:
  contents: write

concurrency:
  group: atlas-daily-prospection
  cancel-in-progress: true

env:
  LEONES_FORGEJO_INSTANCES: https://next.forgejo.org

jobs:
  prospection:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Save run base commit
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Inventory all registered sources
        run: python scripts/prospection/source_coverage.py

      - name: Discover Forgejo and Gitea instances
        run: python scripts/prospection/discover_forge_instances.py

      - name: Run daily source registry
        run: python scripts/prospection/run_daily_prospection.py

      - name: Run federated discovery in isolated parallel workers
        env:
          LEONES_SOURCEHUT_TOKEN: ${{ secrets.LEONES_SOURCEHUT_TOKEN }}
          LEONES_GITLAB_TOKEN: ${{ secrets.LEONES_GITLAB_TOKEN }}
          LEONES_FRAMAGIT_TOKEN: ${{ secrets.LEONES_FRAMAGIT_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/prospection/run_federated_parallel.py --queries 2 --workers 8 --timeout 90

      - name: Run model discovery
        run: python scripts/prospection/bot_models.py --input data/prospection/model_sources.ndjson

      - name: Run runtime discovery
        run: python scripts/prospection/bot_runtimes.py --input data/prospection/runtime_sources.ndjson

      - name: Run agent discovery
        run: python scripts/prospection/bot_agents.py --input data/prospection/agent_sources.ndjson

      - name: Run skill discovery
        run: python scripts/prospection/bot_skills.py --input data/prospection/skill_sources.ndjson

      - name: Run harness discovery
        run: python scripts/prospection/bot_harnesses.py --input data/prospection/harness_sources.ndjson

      - name: Run hardware discovery
        run: python scripts/prospection/bot_hardware.py --input data/prospection/hardware_sources.ndjson

      - name: Merge live and federated discoveries
        run: python scripts/prospection/merge_discoveries.py

      - name: Enrich GitHub discoveries and preserve federated evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/prospection/enrich_github.py --input data/prospection/discovery_input.ndjson

      - name: Enrich GitLab, Framagit, Forgejo and Gitea discoveries
        env:
          LEONES_GITLAB_TOKEN: ${{ secrets.LEONES_GITLAB_TOKEN }}
          LEONES_FRAMAGIT_TOKEN: ${{ secrets.LEONES_FRAMAGIT_TOKEN }}
        run: python scripts/prospection/enrich_sources.py --input data/prospection/enriched_discoveries.ndjson --output data/prospection/enriched_discoveries_sources.ndjson

      - name: Promote source enrichment to classifier input
        run: cp data/prospection/enriched_discoveries_sources.ndjson data/prospection/enriched_discoveries.ndjson

      - name: Classify discoveries
        run: python scripts/prospection/classifier.py --input data/prospection/enriched_discoveries.ndjson --output data/prospection/classified_discoveries.ndjson

      - name: Run Atlas ingest and license gate
        run: python scripts/prospection/daily_atlas_ingest.py

      - name: Publish real prospection feed for web
        run: python scripts/prospection/publish_web_prospection.py

      - name: Generate daily report
        run: python scripts/prospection/daily_report.py

      - name: Upload daily report artifact
        uses: actions/upload-artifact@v7
        with:
          name: atlas-daily-report
          path: |
            data/prospection/daily_report.json
            data/prospection/daily_report.md
            data/prospection/daily_source_report.json
            data/prospection/source_coverage_report.json
            data/prospection/federated_discovery_report.json
            data/prospection/discovery_merge_report.json
            data/prospection/enrichment_report.json
            data/prospection/forge_instances.ndjson
            data/prospection/atlas_review_queue.ndjson
            data/prospection/atlas_candidates.ndjson
            web/data/prospeccion.json
          if-no-files-found: warn

      - name: Publish generated discovery data and report
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p /tmp/leones-generated
          git diff --binary "$BASE_SHA" -- data/prospection/ scripts/prospection/ web/data/ > /tmp/leones-generated/generated.patch || true
          git fetch origin main
          git reset --hard origin/main
          if [ -s /tmp/leones-generated/generated.patch ]; then
            git apply --3way /tmp/leones-generated/generated.patch || {
              echo 'Generated outputs changed upstream; preferring this run for generated files.'
              git apply --reject /tmp/leones-generated/generated.patch || true
            }
          fi
          git add data/prospection/ scripts/prospection/ web/data/
          if git diff --cached --quiet; then
            echo 'No changes to publish.'
          else
            git commit -m 'chore: update daily Atlas prospection report'
            git push origin HEAD:main
          fi
