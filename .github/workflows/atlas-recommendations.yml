name: Generate Atlas Recommendations

on:
  workflow_dispatch:
    inputs:
      workload: {description: "Workload", required: true, default: "chat"}
      hardware: {description: "Hardware profile", required: true, default: "cpu-i5-16gb"}
      ram: {description: "RAM in GB", required: true, default: "16"}
      vram: {description: "VRAM in GB", required: false, default: "0"}
      context: {description: "Required context tokens", required: true, default: "4096"}
      required_jgb: {description: "Minimum JGB level (optional)", required: false, default: ""}
      prefer_jgb: {description: "Prefer higher JGB", required: false, default: "false"}
  schedule:
    - cron: '47 5 * * *'

permissions:
  contents: write

concurrency:
  group: leones-main-writers
  cancel-in-progress: false

jobs:
  recommend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Test hardware price integration
        run: python3 scripts/test_atlas_price_integration.py
      - name: Test economic ranking
        run: python3 scripts/test_atlas_economic_rank.py
      - name: Generate recommendation report
        env:
          WORKLOAD: ${{ inputs.workload || 'chat' }}
          HARDWARE: ${{ inputs.hardware || 'cpu-i5-16gb' }}
          RAM: ${{ inputs.ram || '16' }}
          VRAM: ${{ inputs.vram || '0' }}
          CONTEXT: ${{ inputs.context || '4096' }}
          REQUIRED_JGB: ${{ inputs.required_jgb }}
          PREFER_JGB: ${{ inputs.prefer_jgb || 'false' }}
        run: |
          args="--workload $WORKLOAD --hardware $HARDWARE --ram $RAM --vram $VRAM --context $CONTEXT"
          if [ -n "$REQUIRED_JGB" ]; then args="$args --min-jgb $REQUIRED_JGB"; fi
          if [ "$PREFER_JGB" = "true" ]; then args="$args --prefer-jgb"; fi
          python3 scripts/atlas_recommend_from_feed.py $args
      - name: Generate economic ranking
        env:
          HARDWARE: ${{ inputs.hardware || 'cpu-i5-16gb' }}
          RAM: ${{ inputs.ram || '16' }}
        run: python3 scripts/atlas_economic_rank.py --hardware "$HARDWARE" --ram "$RAM"
      - name: Commit recommendation and economic reports if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prospection/atlas_recommendations.csv data/prospection/atlas_economic_ranking.csv
          if git diff --cached --quiet; then echo "Recommendation reports unchanged"; else git commit -m "data: update Atlas recommendation and economic ranking"; git push; fi
