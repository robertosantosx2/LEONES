name: Generate Atlas Recommendations

on:
  workflow_dispatch:
    inputs:
      workload: {description: "Workload", required: true, default: "chat"}
      hardware: {description: "Hardware profile", required: true, default: "cpu-i5-16gb"}
      ram: {description: "RAM in GB", required: true, default: "16"}
      vram: {description: "VRAM in GB", required: false, default: "0"}
      runtime: {description: "Inference runtime", required: true, default: "llama.cpp"}
      context: {description: "Required context tokens", required: true, default: "4096"}
  schedule:
    - cron: '47 5 * * *'

permissions:
  contents: write

concurrency:
  group: leones-main-writers
  cancel-in-progress: false

jobs:
  recommend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Test hardware price integration
        run: python3 scripts/test_atlas_price_integration.py
      - name: Test economic ranking
        run: python3 scripts/test_atlas_economic_rank.py
      - name: Test measured runtime feedback
        run: PYTHONPATH=. python3 -m pytest -q scripts/test_runtime_feedback_atlas.py
      - name: Apply measured runtime evidence to Atlas feed
        run: python3 scripts/runtime_feedback_atlas.py
      - name: Generate recommendation report through canonical selector
        env:
          WORKLOAD: ${{ inputs.workload || 'chat' }}
          HARDWARE: ${{ inputs.hardware || 'cpu-i5-16gb' }}
          RAM: ${{ inputs.ram || '16' }}
          VRAM: ${{ inputs.vram || '0' }}
          RUNTIME: ${{ inputs.runtime || 'llama.cpp' }}
          CONTEXT: ${{ inputs.context || '4096' }}
        run: |
          python3 scripts/atlas_recommend_from_feed.py \
            --workload "$WORKLOAD" \
            --hardware "$HARDWARE" \
            --ram "$RAM" \
            --vram "$VRAM" \
            --runtime "$RUNTIME" \
            --context "$CONTEXT"
      - name: Generate economic ranking
        env:
          HARDWARE: ${{ inputs.hardware || 'cpu-i5-16gb' }}
          RAM: ${{ inputs.ram || '16' }}
        run: python3 scripts/atlas_economic_rank.py --hardware "$HARDWARE" --ram "$RAM"
      - name: Commit recommendation and economic reports if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prospection/atlas_feed.csv data/prospection/atlas_recommendations.csv data/prospection/atlas_economic_ranking.csv
          if git diff --cached --quiet; then echo "Recommendation reports unchanged"; else git commit -m "data: update Atlas recommendation and economic ranking"; git push; fi
