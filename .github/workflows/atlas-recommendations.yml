name: Generate Atlas Recommendations

on:
  workflow_dispatch:
    inputs:
      workload:
        description: "Workload"
        required: true
        default: "chat"
      hardware:
        description: "Hardware profile"
        required: true
        default: "cpu-i5-16gb"
      ram:
        description: "RAM in GB"
        required: true
        default: "16"
      vram:
        description: "VRAM in GB"
        required: false
        default: "0"
      context:
        description: "Required context tokens"
        required: true
        default: "4096"
      required_jgb:
        description: "Minimum JGB level (optional)"
        required: false
        default: ""
      prefer_jgb:
        description: "Prefer higher JGB"
        required: false
        default: "false"
  schedule:
    - cron: '47 5 * * *'

permissions:
  contents: write

jobs:
  recommend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate recommendation report
        env:
          WORKLOAD: ${{ inputs.workload || 'chat' }}
          HARDWARE: ${{ inputs.hardware || 'cpu-i5-16gb' }}
          RAM: ${{ inputs.ram || '16' }}
          VRAM: ${{ inputs.vram || '0' }}
          CONTEXT: ${{ inputs.context || '4096' }}
          REQUIRED_JGB: ${{ inputs.required_jgb }}
          PREFER_JGB: ${{ inputs.prefer_jgb || 'false' }}
        run: |
          args="--workload $WORKLOAD --hardware $HARDWARE --ram $RAM --vram $VRAM --context $CONTEXT"
          if [ -n "$REQUIRED_JGB" ]; then args="$args --required-jgb $REQUIRED_JGB"; fi
          if [ "$PREFER_JGB" = "true" ]; then args="$args --prefer-jgb"; fi
          python3 scripts/atlas_recommend.py $args
      - name: Commit recommendation report if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prospection/atlas_recommendations.csv
          if git diff --cached --quiet; then
            echo "Recommendation report unchanged"
          else
            git commit -m "data: update Atlas recommendation report"
            git push
          fi
