name: Atlas — Evidencia empírica

on:
  schedule:
    - cron: '27 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-empirical-evidence
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Recoger evidencia empírica pública
        run: python3 scripts/atlas_empirical_collectors.py
      - name: Generar hipótesis
        run: python3 scripts/atlas_hypotheses.py
      - name: Publicar resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prospection/atlas_external_evidence.csv data/prospection/atlas_hypotheses.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "atlas: actualizar evidencia empírica e hipótesis"
          git push
