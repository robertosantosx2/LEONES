name: LEONES Contract Tests

on:
  push:
    paths:
      - 'schemas/**'
      - 'tests/contracts/**'
      - 'tests/**'
      - 'scripts/**'
      - 'benchmarks/agentic/**'
      - 'benchmarks/evidence/**'
      - '.github/workflows/contract-tests.yml'
  pull_request:
    paths:
      - 'schemas/**'
      - 'tests/contracts/**'
      - 'tests/**'
      - 'scripts/**'
      - 'benchmarks/agentic/**'
      - 'benchmarks/evidence/**'
      - '.github/workflows/contract-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install test dependencies
        shell: bash
        run: python -m pip install --upgrade pytest

      - name: Validate JSON schemas
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path('schemas').glob('*.json'))
          assert files, 'No JSON schemas found'
          for path in files:
              with path.open(encoding='utf-8') as f:
                  json.load(f)
              print(f'OK {path}')
          PY

      - name: Run canonical contract suite
        shell: bash
        run: python -m unittest discover -s tests/contracts -p 'test_*.py' -v

      - name: Run FreeToken selector-to-runtime contract regression
        shell: bash
        run: python -m pytest tests/contracts/test_freetoken_selector_contract.py -q

      - name: Run Python regression tests
        shell: bash
        run: python -m pytest tests -q

      - name: Check contract invariants
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          schemas = {p.name: json.loads(p.read_text(encoding='utf-8')) for p in Path('schemas').glob('*.json')}
          evidence = schemas['atlas-evidence-contract-v1.json']
          promotion = schemas['promotion-quality-gate-v1.json']
          router = schemas['atlas-router-contract-v1.json']
          atlas = schemas['atlas-storage-v1.json']
          evidence_storage = schemas['evidence-storage-v1.json']
          for schema in (evidence, promotion, router, atlas, evidence_storage):
              assert schema['properties']['contract_version']['const'] == '1.0'
          states = evidence['properties']['evidence']['items']['properties']['verification_state']['enum']
          assert set(['VERIFIED', 'ESTIMATED', 'UNVERIFIED', 'DISPUTED', 'STALE']).issubset(states)
          assert router['properties']['request']['properties']['osi_mode']['enum'] == ['OPEN_ALL', 'FORCE_COPYLEFT_CHECK']
          assert 'PROMOTED' in promotion['properties']['promotion']['properties']['state']['enum']
          assert atlas['properties']['entity']['properties']['state']['const'] == 'ACCEPTED'
          assert 'lineage' in atlas['required']
          assert 'provenance' in evidence_storage['required']
          print('All contract invariants passed')
          PY

      - name: Verify contract test matrix exists
        shell: bash
        run: test -s tests/contracts/contract-tests.md
