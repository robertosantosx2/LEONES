name: Falcon3 I2_S token selection probe runtime

on:
  push:
    branches:
      - research/falcon3-i2s-token-selection-probe-2026-11-18
    paths:
      - ".github/workflows/bitnet-i2s-nonavx2-control-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-token-selection-probe:
    name: Build scalar llama-completion with token diagnostics
    runs-on: ubuntu-24.04
    steps:
      - name: Check out LEONES research
        uses: actions/checkout@v4

      - name: Check out pinned BitNet and llama.cpp
        uses: actions/checkout@v4
        with:
          repository: microsoft/BitNet
          ref: 0b341e582afbf9e1011f24744b554c96a3477eb5
          submodules: recursive
          path: vendor/BitNet

      - name: Apply temporary src1_cont build-scope workaround
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("vendor/BitNet/3rdparty/llama.cpp/ggml/src/ggml-cpu/ggml-cpu.c")
          source = path.read_text()
          needle = '    // TODO: extract to "extra_op"\n#if GGML_USE_LLAMAFILE\n'
          replacement = (
              '    // TODO: extract to "extra_op"\n'
              '    const bool src1_cont = ggml_is_contiguous(src1);\n'
              '#if GGML_USE_LLAMAFILE\n'
          )
          if source.count(needle) != 1:
              raise SystemExit("Expected src1_cont scope site was not unique")
          path.write_text(source.replace(needle, replacement, 1))
          PY

      - name: Add x86 scalar I2_S tile defaults
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("vendor/BitNet/include/gemm-config.h")
          source = path.read_text()
          old = "#endif // __ARM_FEATURE_DOTPROD\n#endif // __AVX__\n"
          new = (
              "#endif // __ARM_FEATURE_DOTPROD\n"
              "#else\n"
              "/* Scalar x86 fallback: tile sizes do not require SIMD. */\n"
              "#define ROW_BLOCK_SIZE 4\n"
              "#define COL_BLOCK_SIZE 128\n"
              "#define PARALLEL_SIZE 4\n"
              "#endif // __AVX__\n"
          )
          if source.count(old) != 1:
              raise SystemExit("Could not locate the unique gemm-config.h architecture tail")
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Instrument first 16 sampled tokens
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("vendor/BitNet/3rdparty/llama.cpp/tools/completion/completion.cpp")
          source = path.read_text()
          needle = "            common_sampler_accept(smpl, id, /* accept_grammar= */ true);\n"
          addition = """            // Temporary Falcon3 I2_S probe: capture selected token IDs and exact bytes.
                      static int i2s_probe_token_index = 0;
                      if (i2s_probe_token_index < 16) {
                          const std::string piece = common_token_to_piece(ctx, id, false);
                          std::string piece_hex;
                          static constexpr char hex[] = "0123456789abcdef";
                          for (const unsigned char byte : piece) {
                              piece_hex.push_back(hex[(byte >> 4) & 0x0f]);
                              piece_hex.push_back(hex[byte & 0x0f]);
                          }
                          LOG_INF("I2S_TOKEN_PROBE index=%d id=%d eog=%d piece_hex=%s\\n",
                                  i2s_probe_token_index, id, llama_vocab_is_eog(vocab, id),
                                  piece_hex.c_str());
                          ++i2s_probe_token_index;
                      }
          """
          if source.count(needle) != 1:
              raise SystemExit("Expected unique completion sampling site was not found")
          path.write_text(source.replace(needle, needle + addition, 1))
          PY

      - name: Configure LLAMAFILE-OFF non-AVX2 probe runtime
        run: |
          cmake -S vendor/BitNet -B build/bitnet-tokenizer-probe \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_SSE42=OFF \
            -DGGML_F16C=OFF \
            -DGGML_FMA=OFF \
            -DGGML_BMI2=OFF \
            -DGGML_AVX=OFF \
            -DGGML_AVX2=OFF \
            -DGGML_AVX_VNNI=OFF \
            -DGGML_AVX512=OFF \
            -DGGML_AVX512_VNNI=OFF \
            -DGGML_LLAMAFILE=OFF \
            -DLLAMA_BUILD_COMMON=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_APP=OFF \
            -DLLAMA_BUILD_UI=OFF \
            -DLLAMA_BUILD_MTMD=OFF

      - name: Build tokenizer and completion tools
        run: cmake --build build/bitnet-tokenizer-probe --target llama-tokenize llama-completion --parallel 2

      - name: Verify configuration and package diagnostic runtime
        shell: bash
        run: |
          set -euo pipefail
          CACHE=build/bitnet-tokenizer-probe/CMakeCache.txt
          grep -E '^GGML_(NATIVE|SSE42|F16C|FMA|BMI2|AVX|AVX2|AVX_VNNI|AVX512|AVX512_VNNI|LLAMAFILE):BOOL=' "$CACHE"
          for option in GGML_SSE42 GGML_F16C GGML_FMA GGML_BMI2 GGML_AVX GGML_AVX2 GGML_AVX_VNNI GGML_AVX512 GGML_AVX512_VNNI GGML_LLAMAFILE; do
            grep -q "^$option:BOOL=OFF$" "$CACHE"
          done
          grep -q '^GGML_NATIVE:BOOL=OFF$' "$CACHE"
          mkdir -p artifact
          cp build/bitnet-tokenizer-probe/bin/llama-tokenize artifact/
          cp build/bitnet-tokenizer-probe/bin/llama-completion artifact/
          for lib in build/bitnet-tokenizer-probe/bin/lib*.so*; do
            if [ -f "$lib" ]; then
              cp "$lib" artifact/
            fi
          done
          cat > artifact/README.txt <<'EOF'
          Falcon3 I2_S non-AVX2 token-selection probe runtime

          Build provenance:
            BitNet: 0b341e582afbf9e1011f24744b554c96a3477eb5
            llama.cpp submodule: 390c307752ab78fd8189f359d6954c9ba1be74af
            GGML_NATIVE: OFF; AVX/SSE/FMA/BMI2: OFF; LLAMAFILE: OFF

          The completion executable logs the first 16 sampled tokens as
          I2S_TOKEN_PROBE records: index, token ID, EOG flag, and exact token
          piece bytes in hexadecimal. Instrumentation is applied only in this
          ephemeral CI checkout. The model and local checkout are untouched.

          Usage:
            export LD_LIBRARY_PATH="$PWD"
            MODEL=/path/to/ggml-model-i2_s.gguf

          Generation probe (let it finish; do not press Ctrl+C):
            ./llama-completion -m "$MODEL" \
              -p $'<|user|>\n¿Qué es Falcon3?\n<|assistant|>\n' \
              -n 16 -c 256 -no-cnv --ignore-eos --temp 0 --seed 42 \
              --no-display-prompt > token-output.txt 2> token-diagnostics.log
            grep 'I2S_TOKEN_PROBE' token-diagnostics.log

          The stdout file is not the source of truth; inspect the diagnostic
          records in stderr. Decode piece_hex as UTF-8 after reading the IDs.
          EOF
          tar -czf falcon3-i2s-token-selection-probe-runtime.tar.gz -C artifact .

      - name: Upload token-selection probe runtime
        uses: actions/upload-artifact@v4
        with:
          name: falcon3-i2s-token-selection-probe-runtime
          path: falcon3-i2s-token-selection-probe-runtime.tar.gz
          if-no-files-found: error
          retention-days: 7
