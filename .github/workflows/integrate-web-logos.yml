name: Integrate LEONES visual identity

on:
  push:
    branches: [main]
    paths:
      - 'scripts/integrate_web_logos.py'
      - 'web/assets/graphics/logos/**'
      - 'web/assets/graphics/brand.css'
      - 'web/index.html'
      - 'web/pilares.html'
      - 'web/arquitectura.html'
      - 'web/operacion.html'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Integrate visual identity
        run: python3 scripts/integrate_web_logos.py

      - name: Commit generated integration
        run: |
          if git diff --quiet; then
            echo 'No visual identity changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/index.html web/pilares.html web/arquitectura.html web/operacion.html
          git commit -m 'chore: integrate LEONES section logos'
          git push
