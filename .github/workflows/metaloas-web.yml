name: metaLOAS web
on:
  push:
    paths:
      - 'results/metaLOAS/**'
      - 'scripts/metaloas-stats.py'
      - 'web/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install matplotlib
      - run: python3 scripts/metaloas-stats.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/metaLOAS/stats
          git diff --cached --quiet || git commit -m 'chore: update metaLOAS statistics'
          git push
