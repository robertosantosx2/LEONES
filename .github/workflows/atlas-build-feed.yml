name: Build Atlas Feed (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-atlas-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build normalized Atlas feed
        run: python3 scripts/atlas_build_feed.py
      - name: Commit feed if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prospection/atlas_feed.csv
          if git diff --cached --quiet; then
            echo "Atlas feed unchanged"
          else
            git commit -m "data: update Atlas prospection feed"
            git push
          fi
