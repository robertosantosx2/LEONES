name: V1 regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Compile canonical Python paths
        run: |
          python -m py_compile \
            scripts/validate_evidence.py \
            scripts/run_a01_selected.py \
            scripts/runtime_gate.py \
            scripts/record_benchmark.py \
            scripts/run_and_record_benchmark.py \
            benchmarks/agentic/adapters/llmserve_a01.py \
            benchmarks/agentic/graders/a01_grader.py

      - name: Validate every JSON schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = sorted(Path('schemas').glob('*.json'))
          assert paths, 'no schemas found'
          for path in paths:
              json.loads(path.read_text())
              print(f'OK {path}')
          print(f'SCHEMAS: PASS ({len(paths)})')
          PY

      - name: Full regression suite
        run: python -m pytest tests -q

      - name: Evidence promotion guard
        run: |
          python - <<'PY'
          from scripts.validate_evidence import validate_evidence

          real = {
              'evidence_type': 'measured',
              'execution_id': 'ci-real-fixture',
              'measured_at': '2026-08-27T00:00:00+00:00',
              'measurement_kind': 'real',
          }
          synthetic = {
              'evidence_type': 'measured',
              'execution_id': 'ci-synthetic-fixture',
              'measured_at': '2026-08-27T00:00:00+00:00',
              'measurement_kind': 'synthetic',
          }
          assert validate_evidence(real)['evidence_type'] == 'measured'
          try:
              validate_evidence(synthetic)
          except ValueError as exc:
              assert 'synthetic evidence' in str(exc)
          else:
              raise AssertionError('synthetic evidence was promoted to measured')
          print('REAL evidence: ACCEPTED')
          print('SYNTHETIC evidence: REJECTED')
          PY
