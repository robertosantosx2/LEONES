name: Daily OSI Prospection

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      since:
        description: 'Discover repositories updated since YYYY-MM-DD'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Discover OSI-approved models, projects and software
        env:
          GH_TOKEN: ${{ github.token }}
          PROSPECTION_SINCE: ${{ inputs.since }}
        run: |
          python3 scripts/discover_copyleft.py

      - name: Commit discoveries
        run: |
          git config user.name 'LEONES Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/copyleft-discoveries.md web/data/prospeccion.json
          if git diff --cached --quiet; then
            echo 'No new OSI-approved discoveries.'
          else
            git commit -m 'research: update daily OSI prospection'
            git push
          fi
