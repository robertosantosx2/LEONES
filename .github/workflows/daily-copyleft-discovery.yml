name: Daily OSI Prospection

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      since:
        description: 'Discover repositories updated since YYYY-MM-DD'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: daily-osi-prospection
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Discover OSI-approved models, projects and software
        env:
          GH_TOKEN: ${{ github.token }}
          PROSPECTION_SINCE: ${{ github.event.inputs.since || inputs.since || '' }}
        run: |
          echo "PROSPECTION_SINCE=${PROSPECTION_SINCE:-<default>}"
          python3 scripts/discover_copyleft.py

      - name: Commit discoveries and publish safely
        run: |
          git config user.name 'LEONES Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/copyleft-discoveries.md web/data/prospeccion.json

          if git diff --cached --quiet; then
            echo 'No new OSI-approved discoveries.'
            exit 0
          fi

          git commit -m 'research: update daily OSI prospection'

          # The repository may receive other commits while discovery is running.
          # Rebase the generated commit onto the current main before pushing.
          for attempt in 1 2 3; do
            echo "Publish attempt ${attempt}/3"
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo 'Prospection published successfully.'
                exit 0
              fi
            else
              echo 'Rebase conflict. Regenerating against the current main.'
              git rebase --abort || true
              git reset --hard origin/main
              python3 scripts/discover_copyleft.py
              git add research/copyleft-discoveries.md web/data/prospeccion.json
              if git diff --cached --quiet; then
                echo 'No new OSI-approved discoveries after synchronization.'
                exit 0
              fi
              git commit -m 'research: update daily OSI prospection'
            fi
            sleep 5
          done

          echo 'Could not publish prospection after 3 attempts.'
          exit 1
