name: A01 runtime benchmark contract

on:
  pull_request:
    paths:
      - 'scripts/a01_runtime_benchmark.py'
      - 'scripts/run_a01_selected.py'
      - 'scripts/runtime_gate.py'
      - 'benchmarks/agentic/**'
      - 'schemas/runtime-benchmark.v1.schema.json'
      - '.github/workflows/a01-runtime-benchmark-contract.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/a01_runtime_benchmark.py'
      - 'scripts/run_a01_selected.py'
      - 'scripts/runtime_gate.py'
      - 'benchmarks/agentic/**'
      - 'schemas/runtime-benchmark.v1.schema.json'
      - '.github/workflows/a01-runtime-benchmark-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest
      - name: Compile canonical path
        run: |
          python -m py_compile \
            scripts/a01_runtime_benchmark.py \
            scripts/run_a01_selected.py \
            scripts/runtime_gate.py \
            benchmarks/agentic/adapters/llmserve_a01.py \
            benchmarks/agentic/a01_grader.py
      - name: Validate runtime benchmark schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('schemas/runtime-benchmark.v1.schema.json')
          json.loads(path.read_text(encoding='utf-8'))
          print(f'schema: OK {path}')
          PY
      - name: Run canonical selector-to-A01 regression
        run: python -m pytest -q benchmarks/agentic/test_selection_to_a01.py
