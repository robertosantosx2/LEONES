name: NEPENTHES AIPerf runner, importers and telemetry exporters

on:
  pull_request:
    paths:
      - 'scripts/nepenthes_aiperf_import.py'
      - 'scripts/nepenthes_aiperf_run.py'
      - 'scripts/nepenthes_llama_server_metrics.py'
      - 'scripts/nepenthes_nvml_sampler.py'
      - 'scripts/nepenthes_otel_export.py'
      - 'scripts/nepenthes_benchmark_report.py'
      - 'scripts/nepenthes_otel_transport.py'
      - 'scripts/nepenthes_llama_server_capture.py'
      - 'tests/test_nepenthes_aiperf_import.py'
      - 'tests/test_nepenthes_aiperf_run.py'
      - 'scripts/nepenthes_aiperf_evidence.py'
      - 'scripts/nepenthes_overhead_gate.py'
      - 'scripts/nepenthes_privacy.py'
      - 'scripts/runtime_benchmark_evidence.py'
      - 'schemas/runtime-benchmark-evidence.v1.1.json'
      - 'tests/test_nepenthes_aiperf_evidence.py'
      - 'tests/test_nepenthes_overhead_gate.py'
      - 'tests/test_nepenthes_privacy.py'
      - 'tests/test_runtime_benchmark_evidence.py'
      - 'tests/test_nepenthes_llama_server_metrics.py'
      - 'tests/test_nepenthes_nvml_sampler.py'
      - 'tests/test_nepenthes_otel_export.py'
      - 'tests/test_nepenthes_benchmark_report.py'
      - 'tests/test_nepenthes_otel_transport.py'
      - 'tests/test_nepenthes_llama_server_capture.py'
      - '.github/workflows/nepenthes-aiperf-import.yml'
  push:
    paths:
      - 'scripts/nepenthes_aiperf_import.py'
      - 'scripts/nepenthes_aiperf_run.py'
      - 'scripts/nepenthes_llama_server_metrics.py'
      - 'scripts/nepenthes_nvml_sampler.py'
      - 'scripts/nepenthes_otel_export.py'
      - 'scripts/nepenthes_benchmark_report.py'
      - 'scripts/nepenthes_otel_transport.py'
      - 'scripts/nepenthes_llama_server_capture.py'
      - 'tests/test_nepenthes_aiperf_import.py'
      - 'tests/test_nepenthes_aiperf_run.py'
      - 'scripts/nepenthes_aiperf_evidence.py'
      - 'scripts/nepenthes_overhead_gate.py'
      - 'scripts/nepenthes_privacy.py'
      - 'scripts/runtime_benchmark_evidence.py'
      - 'schemas/runtime-benchmark-evidence.v1.1.json'
      - 'tests/test_nepenthes_aiperf_evidence.py'
      - 'tests/test_nepenthes_overhead_gate.py'
      - 'tests/test_nepenthes_privacy.py'
      - 'tests/test_runtime_benchmark_evidence.py'
      - 'tests/test_nepenthes_llama_server_metrics.py'
      - 'tests/test_nepenthes_nvml_sampler.py'
      - 'tests/test_nepenthes_otel_export.py'
      - 'tests/test_nepenthes_benchmark_report.py'
      - 'tests/test_nepenthes_otel_transport.py'
      - 'tests/test_nepenthes_llama_server_capture.py'
      - '.github/workflows/nepenthes-aiperf-import.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  importer-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run offline AIPerf runner and importer tests
        run: python -m pytest -q tests/test_nepenthes_aiperf_import.py tests/test_nepenthes_aiperf_run.py tests/test_nepenthes_aiperf_evidence.py tests/test_nepenthes_overhead_gate.py tests/test_nepenthes_privacy.py tests/test_runtime_benchmark_evidence.py tests/test_nepenthes_llama_server_metrics.py tests/test_nepenthes_nvml_sampler.py tests/test_nepenthes_otel_export.py tests/test_nepenthes_benchmark_report.py tests/test_nepenthes_otel_transport.py tests/test_nepenthes_llama_server_capture.py
