name: NEPENTHES TensorFold host connector

on:
  push:
    branches: [main]
    paths:
      - docs/subprojects/NEPENTHES/TENSORFOLD-HOST-CI.json
      - .github/workflows/nepenthes-tensorfold-host.yml
  pull_request:
    paths:
      - docs/subprojects/NEPENTHES/TENSORFOLD-HOST-CI.json
      - .github/workflows/nepenthes-tensorfold-host.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tensorfold-host:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TENSORFOLD_CACHE: /tmp/tensorfold-test-cache
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Read pinned TensorFold commit
        id: pin
        run: |
          sha=$(python3 -c 'import json; print(json.load(open("docs/subprojects/NEPENTHES/TENSORFOLD-HOST-CI.json"))["commit"])')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: robertosantosx2/TensorFold
          ref: ${{ steps.pin.outputs.sha }}
          path: TensorFold
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          use-cache: false

      - name: Verify exact TensorFold source
        env:
          EXPECTED_SHA: ${{ steps.pin.outputs.sha }}
        run: test "$(git -C TensorFold rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Format TensorFold sources and expose required diff
        working-directory: TensorFold
        run: |
          zig fmt build.zig zig
          git diff --check
          git diff -- zig/src/server/nepenthes_trace.zig

      - name: Host server and golden regressions
        working-directory: TensorFold
        run: zig build -Dfixed-cpu test-server-cpu test-server-security test-pull-security test-golden --test-timeout 20m

      - name: Import TensorFold background lifecycle fixture
        run: |
          python3 scripts/nepenthes_llama_trace_import.py \
            TensorFold/tests/fixtures/nepenthes/tensorfold-background.jsonl \
            --source tensorfold --output "$RUNNER_TEMP/tensorfold-import.json"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["capture_complete"] is True and d["event_count"] == 5' "$RUNNER_TEMP/tensorfold-import.json"

      - name: Reject source mismatch and unknown source
        run: |
          set +e
          mismatch=$(python3 scripts/nepenthes_llama_trace_import.py TensorFold/tests/fixtures/nepenthes/tensorfold-source-mismatch.jsonl --source tensorfold --output "$RUNNER_TEMP/mismatch.json" 2>&1)
          mismatch_status=$?
          unknown=$(python3 scripts/nepenthes_llama_trace_import.py TensorFold/tests/fixtures/nepenthes/tensorfold-background.jsonl --source unknown --output "$RUNNER_TEMP/unknown.json" 2>&1)
          unknown_status=$?
          set -e
          test "$mismatch_status" -eq 2
          test "$unknown_status" -eq 2
          echo "$mismatch" | grep -qi source
          echo "$unknown" | grep -qi invalid

      - name: Preserve incomplete sink accounting
        run: |
          python3 scripts/nepenthes_llama_trace_import.py \
            TensorFold/tests/fixtures/nepenthes/tensorfold-incomplete.jsonl \
            --source tensorfold --output "$RUNNER_TEMP/tensorfold-incomplete.json"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["capture_complete"] is False' "$RUNNER_TEMP/tensorfold-incomplete.json"

      - name: Run shared LEONES importer regressions
        run: python3 -m unittest discover -s tests -p 'test_nepenthes_llama_trace_import.py'
