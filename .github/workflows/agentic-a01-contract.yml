name: Agentic A01 contract

on:
  pull_request:
    paths:
      - 'benchmarks/agentic/**'
      - '.github/workflows/agentic-a01-contract.yml'
  push:
    branches: [main]
    paths:
      - 'benchmarks/agentic/**'
      - '.github/workflows/agentic-a01-contract.yml'

jobs:
  a01-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - name: Run A01 adapter and selector integration tests
        # The fixture runtime is a local Python subprocess: no GPU/model download is involved.
        run: PYTHONPATH=benchmarks/agentic/adapters:benchmarks/agentic:. python -m pytest -q benchmarks/agentic/adapters benchmarks/agentic/test_selection_to_a01.py
