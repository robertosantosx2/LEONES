name: Agentic A01 contract

on:
  pull_request:
    paths:
      - 'benchmarks/agentic/**'
      - 'benchmarks/evidence/**'
      - 'scripts/**'
      - 'runtime_selection/**'
      - 'tests/test_hermes_selection_and_task_benchmark.py'
      - '.github/workflows/agentic-a01-contract.yml'
  push:
    branches: [main]
    paths:
      - 'benchmarks/agentic/**'
      - 'benchmarks/evidence/**'
      - 'scripts/**'
      - 'runtime_selection/**'
      - 'tests/test_hermes_selection_and_task_benchmark.py'
      - '.github/workflows/agentic-a01-contract.yml'

jobs:
  a01-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: PYTHONPATH=. python -m pytest -q
        working-directory: benchmarks/agentic/adapters
      - run: PYTHONPATH=. python -m pytest -q
        working-directory: benchmarks/evidence
      - name: RC3 Hermes -> Leo benchmark contract
        run: PYTHONPATH=. python -m pytest -q tests/test_hermes_selection_and_task_benchmark.py
