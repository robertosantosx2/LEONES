name: LEONES Research Projects Observatory
on:
  schedule:
    - cron: "20 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/research/RESEARCH-PROJECTS-INDEX.md"
      - "scripts/research_catalog/**"
      - "web/investigacion.md"
      - "data/observatory/research-projects.json"
      - ".github/workflows/research-projects-observatory.yml"
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: leones-research-projects-observatory
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild recursive catalog
        run: |
          python -m py_compile scripts/research_catalog/build_research_catalog.py
          python scripts/research_catalog/build_research_catalog.py
      - name: Validate generated catalog and safeguards
        run: |
          python -m json.tool data/observatory/research-projects.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("web/data/research-projects.json").read_text())
          h=Path("web/investigacion.html").read_text()
          assert d["items"] and d["publication_is_not_approval"] is True
          assert d["automatic_priority_changes"] is False
          assert "data/research-projects.json" in h
          assert "leones-logo-principal.svg" in h
          for x in d["items"]: assert x["name"] and x["url"].startswith("https://")
          print("Validated",len(d["items"]),"research projects")
          PY
          git diff --check
      - name: Open or update daily publication PR
        if: github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: automation/research-projects-catalog
          delete-branch: false
          commit-message: "chore(research): refresh recursive project catalog"
          title: "chore(research): refresh LEONES research observatory"
          body: |
            Actualización automática: recorrido recursivo del árbol Git, reconstrucción del catálogo visual y detección de README pendientes de clasificar. No modifica prioridades, INDEX maestros ni gates de aprobación.
