name: LEONES Atlas discovery (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prospect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Discover models
        run: python scripts/prospectors/models.py
      - name: Discover runtimes
        run: python scripts/prospectors/repos.py runtimes
      - name: Discover agents
        run: python scripts/prospectors/repos.py agents
      - name: Discover skills
        run: python scripts/prospectors/repos.py skills
      - name: Discover harnesses
        run: python scripts/prospectors/repos.py harnesses
      - name: Commit discovery snapshot
        run: |
          git config user.name 'LEONES Atlas Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/discovery
          git diff --cached --quiet || git commit -m 'chore: Atlas manual discovery'
          git push
