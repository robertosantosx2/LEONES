name: NEPENTHES Nsight enum and NVTX import

on:
  pull_request:
    paths:
      - "scripts/nepenthes_nsys_import.py"
      - "tests/test_nepenthes_nsys_import.py"
      - "docs/subprojects/NEPENTHES/NSIGHT-ENUM-DECODING.md"
      - "docs/subprojects/NEPENTHES/NSIGHT-NVTX-CORRELATION.md"
      - ".github/workflows/nepenthes-nsys-import.yml"
  push:
    branches: [main]
    paths:
      - "scripts/nepenthes_nsys_import.py"
      - "tests/test_nepenthes_nsys_import.py"
      - "docs/subprojects/NEPENTHES/NSIGHT-ENUM-DECODING.md"
      - "docs/subprojects/NEPENTHES/NSIGHT-NVTX-CORRELATION.md"
      - ".github/workflows/nepenthes-nsys-import.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nsys-import-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run Nsight importer tests
        run: python -m pytest -q tests/test_nepenthes_nsys_import.py
