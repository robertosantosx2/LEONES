name: NEPENTHES llama.cpp trace import

on:
  pull_request:
    paths:
      - "scripts/nepenthes_llama_trace_import.py"
      - "tests/test_nepenthes_llama_trace_import.py"
      - "docs/subprojects/NEPENTHES/LLAMA-TRACE-IMPORT.md"
      - ".github/workflows/nepenthes-llama-trace-import.yml"
  push:
    branches: [main]
    paths:
      - "scripts/nepenthes_llama_trace_import.py"
      - "tests/test_nepenthes_llama_trace_import.py"
      - "docs/subprojects/NEPENTHES/LLAMA-TRACE-IMPORT.md"
      - ".github/workflows/nepenthes-llama-trace-import.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace-import-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run llama.cpp trace import tests
        run: python -m unittest discover -s tests -p "test_nepenthes_llama_trace_import.py" -v
