name: RC4 release gate
on:
  push:
    branches: [rc4-fitllm-recommender, main]
  pull_request:
    branches: [main, rc4-fitllm-recommender]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: RC4 static gate
        run: python3 scripts/rc4_release_gate.py
      - name: RC4 unit tests
        run: python3 -m pip install pytest -q && python3 -m pytest tests/test_rc4_fitllm_recommend.py tests/test_rc4_release_gate.py -q
