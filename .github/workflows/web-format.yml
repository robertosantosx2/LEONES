name: Format web

on:
    push:
        branches:
            - main
        paths:
            - "web/**/*.html"
            - "web/**/*.css"
            - "web/**/*.js"
            - ".prettierrc.json"
            - "package.json"
            - ".github/workflows/web-format.yml"

permissions:
    contents: write

jobs:
    format:
        # Avoid a second formatting commit triggering itself forever.
        if: github.actor != 'github-actions[bot]'
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Install formatter
              run: npm install --no-package-lock

            - name: Format web sources
              run: npx prettier --write "web/**/*.html" "web/**/*.css" "web/**/*.js"

            - name: Commit formatting changes
              run: |
                  if git diff --quiet; then
                    echo "Web sources are already formatted."
                    exit 0
                  fi

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add web
                  git commit -m "style(web): format HTML CSS and JavaScript"
                  git push
