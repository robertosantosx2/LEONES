name: Atlas — Ingesta de prospección NDJSON

on:
  workflow_dispatch:
  schedule:
    - cron: '37 5 * * *'

permissions:
  contents: write

jobs:
  ingest:
    name: Ingesta NDJSON → Atlas
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Ingerir descubrimientos
        run: python3 scripts/atlas_ingest_ndjson.py
      - name: Guardar feed y cola de revisión
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prospection/atlas_feed.csv data/prospection/atlas_review_queue.csv
          if git diff --cached --quiet; then
            echo "Atlas sin cambios"
          else
            git commit -m "data: ingest prospection into Atlas"
            git push
          fi
