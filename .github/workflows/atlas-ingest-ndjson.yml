name: Atlas — Ingesta de prospección NDJSON (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: leones-main-writers
  cancel-in-progress: false

jobs:
  ingest:
    name: Ingesta NDJSON → Atlas
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Ingerir descubrimientos
        run: python3 scripts/atlas_ingest_ndjson.py
      - name: Guardar feed y cola de revisión
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prospection/atlas_feed.csv data/prospection/atlas_review_queue.csv
          if git diff --cached --quiet; then
            echo "Atlas sin cambios"
          else
            git commit -m "data: ingest prospection into Atlas"
            git push
          fi
