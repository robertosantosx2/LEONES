name: Falcon3 I2_S AVX2 fallback diagnostic runtime

on:
  push:
    branches:
      - research/falcon3-i2s-avx2-overflow-2026-11-18
    paths:
      - "research/bitnet/patches/0001-i2s-avx2-activation-diagnostics.patch"
      - ".github/workflows/bitnet-i2s-avx2-fallback-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-fallback-runtime:
    name: Build LLAMAFILE-OFF AVX2 diagnostic llama-cli
    runs-on: ubuntu-24.04
    steps:
      - name: Check out LEONES research
        uses: actions/checkout@v4

      - name: Check out pinned BitNet and llama.cpp
        uses: actions/checkout@v4
        with:
          repository: microsoft/BitNet
          ref: 0b341e582afbf9e1011f24744b554c96a3477eb5
          submodules: recursive
          path: vendor/BitNet

      - name: Apply temporary src1_cont build-scope workaround
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("vendor/BitNet/3rdparty/llama.cpp/ggml/src/ggml-cpu/ggml-cpu.c")
          source = path.read_text()
          needle = '    // TODO: extract to "extra_op"\n#if GGML_USE_LLAMAFILE\n'
          replacement = (
              '    // TODO: extract to "extra_op"\n'
              '    const bool src1_cont = ggml_is_contiguous(src1);\n'
              '#if GGML_USE_LLAMAFILE\n'
          )
          if source.count(needle) != 1:
              raise SystemExit("Expected src1_cont scope site was not unique")
          path.write_text(source.replace(needle, replacement, 1))
          PY

      - name: Apply AVX2 vec-dot activation diagnostics
        run: |
          git -C vendor/BitNet/3rdparty/llama.cpp apply --check \
            "$GITHUB_WORKSPACE/research/bitnet/patches/0001-i2s-avx2-activation-diagnostics.patch"
          git -C vendor/BitNet/3rdparty/llama.cpp apply \
            "$GITHUB_WORKSPACE/research/bitnet/patches/0001-i2s-avx2-activation-diagnostics.patch"

      - name: Configure LLAMAFILE-OFF AVX2 runtime
        run: |
          cmake -S vendor/BitNet -B build/bitnet-fallback \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS=-DGGML_I2S_AVX2_DIAGNOSTICS \
            -DCMAKE_CXX_FLAGS=-DGGML_I2S_AVX2_DIAGNOSTICS \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_AVX=ON \
            -DGGML_AVX2=ON \
            -DGGML_AVX_VNNI=OFF \
            -DGGML_AVX512=OFF \
            -DGGML_AVX512_VNNI=OFF \
            -DGGML_LLAMAFILE=OFF \
            -DLLAMA_BUILD_COMMON=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_APP=OFF \
            -DLLAMA_BUILD_UI=OFF \
            -DLLAMA_BUILD_MTMD=OFF

      - name: Build llama-cli
        run: cmake --build build/bitnet-fallback --target llama-cli --parallel 2

      - name: Verify build configuration and package runtime
        shell: bash
        run: |
          set -euo pipefail
          CACHE=build/bitnet-fallback/CMakeCache.txt
          grep -E '^GGML_(LLAMAFILE|AVX2|AVX_VNNI|NATIVE):BOOL=' "$CACHE"
          grep -q '^GGML_LLAMAFILE:BOOL=OFF$' "$CACHE"
          grep -q '^GGML_AVX2:BOOL=ON$' "$CACHE"
          grep -q '^GGML_AVX_VNNI:BOOL=OFF$' "$CACHE"
          mkdir -p artifact
          cp build/bitnet-fallback/bin/llama-cli artifact/
          for lib in build/bitnet-fallback/bin/lib*.so*; do
            if [ -f "$lib" ]; then
              cp "$lib" artifact/
            fi
          done
          cat > artifact/README.txt <<'EOF'
          Falcon3 I2_S AVX2 fallback diagnostic runtime

          Build provenance:
            BitNet: 0b341e582afbf9e1011f24744b554c96a3477eb5
            llama.cpp submodule: 390c307752ab78fd8189f359d6954c9ba1be74af
            GGML_NATIVE: OFF
            GGML_AVX2: ON
            GGML_AVX_VNNI: OFF
            GGML_AVX512: OFF
            GGML_LLAMAFILE: OFF
            GGML_I2S_AVX2_DIAGNOSTICS: enabled in C and C++

          This runtime intentionally disables LLAMAFILE so single-column I2_S
          generation can reach the AVX2 vec-dot fallback. The diagnostic shadow
          reports the scalar lane accumulator range and int16 overflow counts.
          This is a diagnostic build, not a benchmark or a production runtime.

          Run from this directory (replace the model path):
            export LD_LIBRARY_PATH="$PWD${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            ./llama-cli -m /path/to/ggml-model-i2_s.gguf -p "Responde brevemente en español: ¿qué es Falcon3?" -n 32 -c 512 --single-turn --no-display-prompt > falcon3-i2s-output.txt 2> falcon3-i2s-diagnostics.log

          Inspect:
            grep -E 'I2S_AVX2_DIAG|I2S_LLAMAFILE_DIAG' falcon3-i2s-diagnostics.log
            cat falcon3-i2s-output.txt

          Expected route marker: I2S_AVX2_DIAG. If it is absent, do not infer
          that the vec-dot ran; inspect the full stderr and dispatch before
          drawing conclusions. The first 64 wrapper calls are instrumented.
          EOF
          tar -czf falcon3-i2s-avx2-fallback-runtime.tar.gz -C artifact .

      - name: Upload AVX2 fallback runtime
        uses: actions/upload-artifact@v4
        with:
          name: falcon3-i2s-avx2-fallback-runtime
          path: falcon3-i2s-avx2-fallback-runtime.tar.gz
          if-no-files-found: error
          retention-days: 7
