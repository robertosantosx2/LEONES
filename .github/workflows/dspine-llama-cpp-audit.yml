name: DSpine llama.cpp audit

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/dspine-llama-cpp-audit.sh"
      - "scripts/audit_dspine_llama_cpp.py"
      - "scripts/verify_qwen3_8_27b_dspine_gguf.py"
      - "tests/test_audit_dspine_llama_cpp.py"
      - "docs/subprojects/DSpine-llama.cpp/**"
      - ".github/workflows/dspine-llama-cpp-audit.yml"
  push:
    branches:
      - research/dspine-llama-cpp
    paths:
      - "scripts/dspine-llama-cpp-audit.sh"
      - "scripts/audit_dspine_llama_cpp.py"
      - "tests/test_audit_dspine_llama_cpp.py"
      - "docs/subprojects/DSpine-llama.cpp/**"
      - ".github/workflows/dspine-llama-cpp-audit.yml"

permissions:
  contents: read

jobs:
  audit-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout LEONES
        uses: actions/checkout@v4

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git python3

      - name: Test DSpine capability auditor
        run: python3 -m unittest discover -s tests -p 'test_audit_dspine_llama_cpp.py' -v

      - name: Audit fork and build llama.cpp CPU baseline
        run: |
          bash scripts/dspine-llama-cpp-audit.sh 2>&1 | tee "$RUNNER_TEMP/dspine-audit.log"

      - name: Upload audit report and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dspine-llama-cpp-audit
          path: |
            ${{ runner.temp }}/dspine-audit.log
            ${{ runner.temp }}/dspine-llama-cpp-audit/dspine-audit.json
          if-no-files-found: warn
          retention-days: 30


  verify-qwen3-8-27b-dspine:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout LEONES
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GGUF verification dependencies
        run: python -m pip install --no-cache-dir numpy huggingface_hub

      - name: Clone llama.cpp DSpine branch
        run: |
          git clone --depth 1 --single-branch --branch dspine https://github.com/Ajay9o9/llama.cpp.git "$RUNNER_TEMP/llama.cpp-dspine"
          git -C "$RUNNER_TEMP/llama.cpp-dspine" rev-parse HEAD

      - name: Download and validate Qwen3.8-27B DSpine GGUF
        env:
          LLAMA_CPP_DIR: ${{ runner.temp }}/llama.cpp-dspine
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python scripts/verify_qwen3_8_27b_dspine_gguf.py

      - name: Upload validated DSpine drafter and SHA report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: qwen3.8-27b-dspine-b16-q4km-gguf
          path: |
            ${{ runner.temp }}/Qwen3.8-27B-DSpine-b16-Q4_K_M.gguf
            ${{ runner.temp }}/qwen3.8-27b-dspine-gguf-report.json
          if-no-files-found: error
          retention-days: 14
