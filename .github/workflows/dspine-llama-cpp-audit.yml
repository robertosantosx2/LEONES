name: DSpine llama.cpp audit

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/dspine-llama-cpp-audit.sh"
      - "scripts/audit_dspine_llama_cpp.py"
      - "tests/test_audit_dspine_llama_cpp.py"
      - "docs/subprojects/DSpine-llama.cpp/**"
      - ".github/workflows/dspine-llama-cpp-audit.yml"
  push:
    branches:
      - research/dspine-llama-cpp
    paths:
      - "scripts/dspine-llama-cpp-audit.sh"
      - "scripts/audit_dspine_llama_cpp.py"
      - "tests/test_audit_dspine_llama_cpp.py"
      - "docs/subprojects/DSpine-llama.cpp/**"
      - ".github/workflows/dspine-llama-cpp-audit.yml"

permissions:
  contents: read

jobs:
  audit-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout LEONES
        uses: actions/checkout@v4

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git python3

      - name: Test DSpine capability auditor
        run: python3 -m unittest discover -s tests -p 'test_audit_dspine_llama_cpp.py' -v

      - name: Audit fork and build llama.cpp CPU baseline
        run: |
          bash scripts/dspine-llama-cpp-audit.sh 2>&1 | tee "$RUNNER_TEMP/dspine-audit.log"

      - name: Upload audit report and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dspine-llama-cpp-audit
          path: |
            ${{ runner.temp }}/dspine-audit.log
            ${{ runner.temp }}/dspine-llama-cpp-audit/dspine-audit.json
          if-no-files-found: warn
          retention-days: 30
