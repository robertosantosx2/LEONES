name: DSpine llama.cpp audit

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/dspine-llama-cpp-audit.sh"
      - "scripts/audit_dspine_llama_cpp.py"
      - "tests/test_audit_dspine_llama_cpp.py"
      - "docs/subprojects/DSpine-llama.cpp/**"
      - ".github/workflows/dspine-llama-cpp-audit.yml"
  push:
    branches:
      - research/dspine-llama-cpp
    paths:
      - "scripts/dspine-llama-cpp-audit.sh"
      - "scripts/audit_dspine_llama_cpp.py"
      - "tests/test_audit_dspine_llama_cpp.py"
      - "docs/subprojects/DSpine-llama.cpp/**"
      - ".github/workflows/dspine-llama-cpp-audit.yml"

permissions:
  contents: read

jobs:
  audit-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout LEONES
        uses: actions/checkout@v4

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git python3

      - name: Test DSpine capability auditor
        run: python3 -m unittest discover -s tests -p 'test_audit_dspine_llama_cpp.py' -v

      - name: Audit fork and build llama.cpp CPU baseline
        run: |
          bash scripts/dspine-llama-cpp-audit.sh 2>&1 | tee "$RUNNER_TEMP/dspine-audit.log"

      - name: Upload audit report and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dspine-llama-cpp-audit
          path: |
            ${{ runner.temp }}/dspine-audit.log
            ${{ runner.temp }}/dspine-llama-cpp-audit/dspine-audit.json
          if-no-files-found: warn
          retention-days: 30


  convert-qwen3-8b-dspine:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout LEONES
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU conversion dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy safetensors transformers sentencepiece protobuf huggingface_hub

      - name: Convert official Qwen3-8B DSpine checkpoint to GGUF
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python scripts/convert_qwen3_8b_dspine_ci.py

      - name: Upload validated DSpine drafter
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-8b-dspine-b16-bf16-gguf
          path: ${{ runner.temp }}/Qwen3-8B-DSpine-b16-BF16.gguf
          if-no-files-found: error
          retention-days: 14
