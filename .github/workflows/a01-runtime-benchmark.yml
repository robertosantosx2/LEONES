name: A01 runtime benchmark

on:
  workflow_dispatch:
    inputs:
      selection_json:
        description: 'Selector output JSON (candidates[])'
        required: true
        type: string
      runtime_commands_json:
        description: 'Trusted runtime argv map JSON'
        required: true
        type: string

jobs:
  a01-runtime-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize selector and trusted runtime inputs
        env:
          SELECTION_JSON: ${{ inputs.selection_json }}
          RUNTIME_COMMANDS_JSON: ${{ inputs.runtime_commands_json }}
        run: |
          mkdir -p artifacts
          printf '%s\n' "$SELECTION_JSON" > artifacts/selector-output.json
          printf '%s\n' "$RUNTIME_COMMANDS_JSON" > artifacts/runtime-commands.json
          python -m json.tool artifacts/selector-output.json >/dev/null
          python -m json.tool artifacts/runtime-commands.json >/dev/null
      - name: Execute selector -> runtime-selection.v1 -> A01 -> grader -> benchmark -> evidence -> Router
        run: |
          python scripts/a01_runtime_benchmark.py \
            --selection artifacts/selector-output.json \
            --runtime-commands artifacts/runtime-commands.json \
            --workspace .leones/a01-workspace \
            --out artifacts/a01-runtime-benchmark.v1.json
      - name: Upload canonical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a01-runtime-benchmark
          path: |
            artifacts/selector-output.json
            artifacts/runtime-commands.json
            artifacts/a01-executor-result.json
            artifacts/a01-runtime-benchmark.v1.json
