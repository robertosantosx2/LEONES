name: NEPENTHES llama.cpp upstream monitor

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LEONES
        uses: actions/checkout@v4
      - name: Compare upstream master with reviewed pin
        id: compare
        shell: bash
        run: |
          set -euo pipefail
          current="$(git ls-remote https://github.com/ggml-org/llama.cpp.git refs/heads/master | awk '{print $1}')"
          pinned="$(python -c 'import json; print(json.load(open("docs/subprojects/NEPENTHES/LLAMA-CPP-UPSTREAM.json"))["verified_commit"])')"
          if [[ -z "$current" ]]; then
            echo 'Could not resolve upstream master' >&2
            exit 1
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          if [[ "$current" != "$pinned" ]]; then
            echo 'outdated=true' >> "$GITHUB_OUTPUT"
          else
            echo 'outdated=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Open or update upstream drift issue
        if: steps.compare.outputs.outdated == 'true'
        uses: actions/github-script@v7
        env:
          CURRENT_SHA: ${{ steps.compare.outputs.current }}
          PINNED_SHA: ${{ steps.compare.outputs.pinned }}
        with:
          script: |
            const title = 'NEPENTHES: llama.cpp upstream update available';
            const { owner, repo } = context.repo;
            const body = [
              'The daily upstream monitor found that `ggml-org/llama.cpp` master has advanced.',
              '',
              `- Reviewed pin: \`${process.env.PINNED_SHA}\``,
              `- Current upstream: \`${process.env.CURRENT_SHA}\``,
              `- Compare: https://github.com/ggml-org/llama.cpp/compare/${process.env.PINNED_SHA}...${process.env.CURRENT_SHA}`,
              '',
              'Review upstream changes, update the manifest, and rebase the NEPENTHES integration branch. This check does not auto-merge or auto-update the fork/submodule.'
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            const issue = existing.data.find(item => item.title === title && !item.pull_request);
            if (issue) {
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }
