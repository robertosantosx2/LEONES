name: Atlas daily prospection sync

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atlas-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Ingest verified prospection evidence
        run: python scripts/atlas_ingest_prospection.py

      - name: Commit Atlas changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prospection/ web/proyectos/atlas/deployments_v0_1.csv
          if git diff --cached --quiet; then
            echo "No Atlas changes to commit."
          else
            git commit -m "chore: sync daily Atlas prospection"
            git push
          fi
