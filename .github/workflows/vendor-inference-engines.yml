name: Vendor inference engine sources

on:
  push:
    branches:
      - research/kinetic-audit-benchmark
    paths:
      - "scripts/vendor_engines.py"
      - "configs/engines.registry.json"
      - ".github/workflows/vendor-inference-engines.yml"
  workflow_dispatch:
    inputs:
      engines:
        description: "Comma-separated registry IDs (e.g. kinetic,tensorfold,tandem-cpp)"
        required: true
        default: "kinetic,tensorfold,tandem-cpp"
      ref_overrides:
        description: "Optional comma-separated id=ref overrides"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LEONES
        uses: actions/checkout@v4
        with:
          ref: research/kinetic-audit-benchmark
          fetch-depth: 1

      - name: Install Git LFS
        run: git lfs install

      - name: Vendor pinned engine source snapshots
        shell: bash
        env:
          ENGINE_LIST: ${{ inputs.engines }}
          REF_LIST: ${{ inputs.ref_overrides }}
        run: |
          args=()
          IFS=',' read -ra engines <<< "$ENGINE_LIST"
          for engine in "${engines[@]}"; do
            engine="$(echo "$engine" | xargs)"
            [[ -n "$engine" ]] && args+=(--engine "$engine")
          done
          IFS=',' read -ra refs <<< "$REF_LIST"
          for item in "${refs[@]}"; do
            item="$(echo "$item" | xargs)"
            [[ -n "$item" ]] && args+=(--ref "$item")
          done
          python3 scripts/vendor_engines.py "${args[@]}"

      - name: Commit source snapshots to LEONES
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add third_party/engines
          if git diff --cached --quiet; then
            echo "No vendored source changes."
            exit 0
          fi
          git commit -m "Vendor pinned inference engine source snapshots"
          git push origin HEAD:research/kinetic-audit-benchmark
