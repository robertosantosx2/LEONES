name: BitNet I2_S AVX2 overflow reproducer

on:
  push:
    branches:
      - research/falcon3-i2s-avx2-overflow-2026-11-18
    paths:
      - "research/bitnet/reproducers/repro_i2s_avx2_dot.c"
      - ".github/workflows/bitnet-i2s-avx2-overflow.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce-avx2-overflow:
    name: Reproduce against pinned BitNet llama.cpp
    runs-on: ubuntu-24.04
    steps:
      - name: Check out LEONES research
        uses: actions/checkout@v4

      - name: Check out BitNet with its pinned llama.cpp submodule
        uses: actions/checkout@v4
        with:
          repository: microsoft/BitNet
          ref: 0b341e582afbf9e1011f24744b554c96a3477eb5
          submodules: recursive
          path: vendor/BitNet

      - name: Work around unrelated src1_cont conditional-scope defect
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("vendor/BitNet/3rdparty/llama.cpp/ggml/src/ggml-cpu/ggml-cpu.c")
          source = path.read_text()
          needle = '    // TODO: extract to "extra_op"\n#if GGML_USE_LLAMAFILE\n'
          replacement = (
              '    // TODO: extract to "extra_op"\n'
              '    const bool src1_cont = ggml_is_contiguous(src1);\n'
              '#if GGML_USE_LLAMAFILE\n'
          )
          if source.count(needle) != 1:
              raise SystemExit("Expected src1_cont scope site was not unique")
          path.write_text(source.replace(needle, replacement, 1))
          PY

      - name: Configure AVX2 fallback build
        run: |
          cmake -S vendor/BitNet -B build/bitnet \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_AVX=ON \
            -DGGML_AVX2=ON \
            -DGGML_AVX_VNNI=OFF \
            -DGGML_AVX512=OFF \
            -DGGML_AVX512_VNNI=OFF \
            -DGGML_LLAMAFILE=OFF \
            -DGGML_BUILD_TESTS=OFF \
            -DGGML_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_COMMON=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_APP=OFF \
            -DLLAMA_BUILD_UI=OFF \
            -DLLAMA_BUILD_MTMD=OFF

      - name: Build GGML
        run: cmake --build build/bitnet --target ggml-cpu --parallel 2

      - name: Locate and verify AVX2 vec-dot symbol
        id: library
        shell: bash
        run: |
          set -euo pipefail
          LIB="$(find build/bitnet -type f -name 'libggml-cpu.so*' -print -quit)"
          test -n "$LIB"
          nm -D --defined-only "$LIB" | grep -E '[[:space:]]ggml_vec_dot_i2_i8_s$'
          echo "path=$GITHUB_WORKSPACE/$LIB" >> "$GITHUB_OUTPUT"
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/$(dirname "$LIB"):${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Compile differential reproducer
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            research/bitnet/reproducers/repro_i2s_avx2_dot.c \
            -ldl -o build/repro_i2s_avx2_dot

      - name: Run differential reproducer
        env:
          GGML_CPU_LIBRARY: ${{ steps.library.outputs.path }}
        run: build/repro_i2s_avx2_dot "$GGML_CPU_LIBRARY" --expect-baseline
