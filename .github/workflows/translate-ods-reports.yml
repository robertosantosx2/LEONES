name: Generate English ODS integration reports

on:
  push:
    branches: [ods-evolution]

permissions:
  contents: write

jobs:
  translate:
    if: contains(github.event.head_commit.message, 'docs: generate English ODS integration reports') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install googletrans==4.0.2
      - name: Translate integration reports
        run: |
          cat > /tmp/translate_reports.py <<'PY'
          import asyncio, re, subprocess
          from pathlib import Path
          from googletrans import Translator

          ROOT = Path("docs/integrations")
          EXCLUDE = {"README.md", "readme-eng.md"}

          def protect(text):
              saved = []
              pat = re.compile(r"(\x60\x60\x60[\s\S]*?\x60\x60\x60|\x60[^\x60]*\x60|https?://[^\s)]+)")
              def repl(m):
                  token = f"ZXQPROTECT{len(saved)}QXZ"
                  saved.append(m.group(0))
                  return token
              return pat.sub(repl, text), saved

          def restore(text, saved):
              for i, value in enumerate(saved):
                  text = text.replace(f"ZXQPROTECT{i}QXZ", value)
              return text

          async def main():
              files = []
              for p in ROOT.rglob("*.md"):
                  if p.name in EXCLUDE or p.name.endswith("-eng.mkd"):
                      continue
                  files.append(p)

              async with Translator(service_urls=["translate.googleapis.com"]) as tr:
                  for p in files:
                      out = p.with_name(p.stem + "-eng.mkd")
                      text = p.read_text(encoding="utf-8")
                      protected, saved = protect(text)
                      try:
                          detected = await tr.detect(protected)
                          if detected.lang == "en":
                              translated = protected
                          else:
                              translated = (await tr.translate(protected, dest="en")).text
                          out.write_text(restore(translated, saved), encoding="utf-8")
                          print(f"{p} -> {out} ({detected.lang})")
                      except Exception as e:
                          print(f"ERROR {p}: {e}")
                          if out.exists():
                              out.unlink()
                      await asyncio.sleep(0.5)

              subprocess.run(["git","config","user.name","ODS Docs Bot"], check=True)
              subprocess.run(["git","config","user.email","actions@github.com"], check=True)
              subprocess.run(["git","add","docs/integrations"], check=True)
              if subprocess.run(["git","diff","--cached","--quiet"]).returncode != 0:
                  subprocess.run(["git","commit","-m","docs: generate English ODS integration reports"], check=True)
                  subprocess.run(["git","push"], check=True)

          asyncio.run(main())
          PY
          python /tmp/translate_reports.py
