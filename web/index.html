<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOAS · metaLOAS</title><style>body{font-family:system-ui,sans-serif;max-width:1250px;margin:auto;padding:24px;line-height:1.4}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{border:1px solid #ddd;border-radius:10px;padding:15px}.metric{font-size:2rem;font-weight:700}select{padding:8px;margin:4px 8px 4px 0}table{width:100%;border-collapse:collapse;margin-top:16px}th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}.muted{color:#666}</style></head><body><h1>LOAS · metaLOAS</h1><p class="muted">Evidencia pública de hardware de consumo y pruebas agentivas. Sin datos personales.</p><section><label>RAM <select id="ram"><option value="">Todas</option></select></label><label>Perfil <select id="profile"><option value="">Todos</option></select></label><label>SO <select id="os"><option value="">Todos</option></select></label><label>CPU <select id="cpu"><option value="">Todas</option></select></label><label>GPU <select id="gpu"><option value="">Todas</option></select></label><label>Modelo <select id="model"><option value="">Todos</option></select></label></section><section class="grid"><div class="card"><div class="muted">Informes</div><div id="reports" class="metric">—</div></div><div class="card"><div class="muted">Media tok/s</div><div id="avg" class="metric">—</div></div><div class="card"><div class="muted">≥ 10 tok/s</div><div id="min10" class="metric">—</div></div><div class="card"><div class="muted">≥ 100 tok/s</div><div id="max100" class="metric">—</div></div></section><h2>Comparativa</h2><table><thead><tr><th>Perfil</th><th>RAM</th><th>CPU</th><th>GPU</th><th>Modelo</th><th>tok/s</th><th>Agentivo</th></tr></thead><tbody id="rows"></tbody></table><h2>Gráficas</h2><div class="grid"><div class="card"><h3>Rendimiento</h3><img src="../results/metaLOAS/stats/tokens-per-second.png" width="100%"></div><div class="card"><h3>LOTB</h3><img src="../results/metaLOAS/stats/lotb-pass.png" width="100%"></div><div class="card"><h3>RAM</h3><img src="../results/metaLOAS/stats/ram.png" width="100%"></div><div class="card"><h3>Perfiles</h3><img src="../results/metaLOAS/stats/profiles.png" width="100%"></div></div><p><a href="../results/metaLOAS/stats/README.md">Resumen estadístico</a> · <a href="../results/metaLOAS/">Informes metaLOAS</a></p><script>
let data=[];const base='../results/metaLOAS/';const $=id=>document.getElementById(id);function parse(t,file){let g=k=>{let m=t.match(new RegExp('^- '+k+':\\s*(.+)$','m'));return m?m[1].trim():''};let mm=t.match(/^- Fichero\/modelo:\s*`?([^`\n]+)`?/m);let tt=t.match(/^- Inferencia:\s*([0-9.,]+)/m);return{file,ram:g('RAM'),profile:g('Perfil LOAS'),os:g('Sistema'),cpu:g('CPU'),gpu:g('GPU'),model:mm?mm[1].trim():'',tok:tt?parseFloat(tt[1].replace(',','.')):null,result:g('Resultado agentivo')}}
async function load(){let r=await fetch(base+'manifest.json');if(r.ok){for(const f of await r.json()){let x=await fetch(base+f);if(x.ok)data.push(parse(await x.text(),f))}}render();['ram','profile','os','cpu','gpu','model'].forEach(id=>opts(id,id));}function opts(id,key){let s=$(id),v=[...new Set(data.map(x=>x[key]).filter(Boolean))].sort();s.innerHTML='<option value="">'+(id==='profile'?'Todos':'Todas')+'</option>'+v.map(x=>`<option value="${x}">${x}</option>`).join('');s.onchange=render}function render(){let f={ram:$('ram').value,profile:$('profile').value,os:$('os').value,cpu:$('cpu').value,gpu:$('gpu').value,model:$('model').value};let d=data.filter(x=>Object.entries(f).every(([k,v])=>!v||x[k]===v)),n=d.map(x=>x.tok).filter(Number.isFinite);$('reports').textContent=d.length;$('avg').textContent=n.length?(n.reduce((a,b)=>a+b,0)/n.length).toFixed(2):'—';$('min10').textContent=n.filter(x=>x>=10).length;$('max100').textContent=n.filter(x=>x>=100).length;$('rows').innerHTML=d.map(x=>`<tr><td>${x.profile}</td><td>${x.ram}</td><td>${x.cpu}</td><td>${x.gpu}</td><td>${x.model}</td><td>${x.tok??'—'}</td><td>${x.result}</td></tr>`).join('')||'<tr><td colspan="7">No hay datos para este filtro.</td></tr>'}load();</script></body></html>
