<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Pila de ejecución LEONES</title><desc id="desc">Desde hardware y sistema operativo hasta runtime, backend, modelo, harness, skills y LOTB.</desc><defs><style>.paper{fill:#f5f5f5}.node{fill:#fff;stroke:#2d3142;stroke-width:1.2}.focal{fill:rgba(235,108,54,.08);stroke:#eb6c36;stroke-width:1.2}.ink{font-family:Arial,sans-serif;font-weight:600;font-size:15px;fill:#2d3142}.sub{font-family:Arial,sans-serif;font-size:10px;letter-spacing:.08em;fill:#4f5d75}.arrow{stroke:#4f5d75;stroke-width:1.2;fill:none;marker-end:url(#arrow)}.accent{stroke:#eb6c36;stroke-width:1.4;fill:none;marker-end:url(#arrowAccent)}.note{font-family:Arial,sans-serif;font-size:12px;font-style:italic;fill:#4f5d75}</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#4f5d75"/></marker><marker id="arrowAccent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#eb6c36"/></marker></defs><rect class="paper" width="1200" height="560"/><text x="48" y="48" class="sub">LEONES · EJECUCIÓN</text><text x="48" y="80" class="ink" style="font-size:28px">La pila es sustituible</text><text x="48" y="102" class="note">LEONES busca qué capa limita la tarea y recomienda el cambio de mayor impacto.</text><path class="accent" d="M600 165V195"/><path class="arrow" d="M600 275V305"/><path class="arrow" d="M600 385V415"/><path class="arrow" d="M600 495V525"/><g transform="translate(440 125)"><rect class="focal" width="320" height="80" rx="6"/><image href="logos/leones-hardware.svg" x="16" y="12" width="56" height="56"/><text x="88" y="45" class="ink">Hardware</text><text x="88" y="64" class="sub">CONOCE · CPU · GPU · RAM</text></g><g transform="translate(440 235)"><rect class="node" width="320" height="80" rx="6"/><text x="160" y="42" text-anchor="middle" class="ink">Sistema operativo</text><text x="160" y="62" text-anchor="middle" class="sub">DEBIAN · UBUNTU · RHEL</text></g><g transform="translate(440 345)"><rect class="node" width="320" height="80" rx="6"/><text x="160" y="42" text-anchor="middle" class="ink">Runtime / Drivers</text><text x="160" y="62" text-anchor="middle" class="sub">EJECUTA</text></g><g transform="translate(80 455)"><rect class="node" width="220" height="70" rx="6"/><text x="110" y="38" text-anchor="middle" class="ink">Backend</text><text x="110" y="56" text-anchor="middle" class="sub">INFERENCIA LOCAL</text></g><path class="arrow" d="M440 385H300V455"/><g transform="translate(350 455)"><rect class="node" width="220" height="70" rx="6"/><text x="110" y="38" text-anchor="middle" class="ink">Modelo + Quant</text><text x="110" y="56" text-anchor="middle" class="sub">GENERA</text></g><path class="arrow" d="M760 385H900V455"/><g transform="translate(900 455)"><rect class="node" width="220" height="70" rx="6"/><image href="logos/leones-agents.svg" x="12" y="8" width="54" height="54"/><text x="78" y="38" class="ink">Harness / Skills</text><text x="78" y="56" class="sub">AGENTIC</text></g><path class="accent" d="M1100 525H1020"/><g transform="translate(650 455)"><rect class="focal" width="220" height="70" rx="6"/><image href="logos/leones-evidencia.svg" x="12" y="8" width="54" height="54"/><text x="78" y="38" class="ink">LOTB</text><text x="78" y="56" class="sub">MIDE · EVIDENCIA</text></g><path class="arrow" d="M870 490H900"/><text x="600" y="548" text-anchor="middle" class="note">Cambiar una sola capa puede mejorar toda la experiencia: primero medir, después decidir.</text></svg>