<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Bucle de aprendizaje LEONES</title><desc id="desc">La prospección descubre, Atlas conserva conocimiento, Router recomienda, el usuario ejecuta, Benchmark mide, la Manada comparte y Stats devuelve evidencia agregada al conocimiento.</desc><defs><style>.paper{fill:#f5f5f5}.node{fill:#fff;stroke:#2d3142;stroke-width:1.2}.hub{fill:rgba(235,108,54,.08);stroke:#eb6c36;stroke-width:1.2}.ink{font-family:Arial,sans-serif;font-weight:600;font-size:15px;fill:#2d3142}.sub{font-family:Arial,sans-serif;font-size:10px;letter-spacing:.08em;fill:#4f5d75}.arrow{stroke:#4f5d75;stroke-width:1.2;fill:none;marker-end:url(#arrow)}.write{stroke:#eb6c36;stroke-width:1.4;fill:none;stroke-dasharray:5 4;marker-end:url(#arrowAccent)}.note{font-family:Arial,sans-serif;font-size:12px;font-style:italic;fill:#4f5d75}</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#4f5d75"/></marker><marker id="arrowAccent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#eb6c36"/></marker></defs><rect class="paper" width="1200" height="560"/><text x="48" y="48" class="sub">LEONES · APRENDIZAJE COLECTIVO</text><text x="48" y="80" class="ink" style="font-size:28px">La Manada cierra el bucle</text><text x="48" y="102" class="note">Cada medición local puede convertirse, si el usuario quiere, en evidencia colectiva para mejorar futuras recomendaciones.</text><path class="arrow" d="M350 180H490"/><path class="arrow" d="M710 180H850"/><path class="arrow" d="M960 250V350"/><path class="arrow" d="M850 420H710"/><path class="arrow" d="M490 420H350"/><path class="write" d="M240 350V250H350"/><path class="write" d="M850 250V205H710"/><g transform="translate(130 135)"><rect class="node" width="220" height="90" rx="6"/><image href="logos/leones-prospection.svg" x="14" y="12" width="64" height="64"/><text x="92" y="44" class="ink">Prospección</text><text x="92" y="63" class="sub">DESCUBRE</text></g><g transform="translate(490 135)"><rect class="node" width="220" height="90" rx="6"/><image href="logos/leones-atlas.svg" x="14" y="12" width="64" height="64"/><text x="92" y="44" class="ink">Atlas</text><text x="92" y="63" class="sub">CONOCE</text></g><g transform="translate(850 135)"><rect class="node" width="220" height="90" rx="6"/><image href="logos/leones-router.svg" x="14" y="12" width="64" height="64"/><text x="92" y="44" class="ink">Router</text><text x="92" y="63" class="sub">RECOMIENDA</text></g><g transform="translate(850 375)"><rect class="node" width="220" height="90" rx="6"/><image href="logos/leones-evidencia.svg" x="14" y="12" width="64" height="64"/><text x="92" y="44" class="ink">Benchmark</text><text x="92" y="63" class="sub">MIDE</text></g><g transform="translate(490 375)"><rect class="node" width="220" height="90" rx="6"/><image href="logos/leones-manada.svg" x="14" y="12" width="64" height="64"/><text x="92" y="44" class="ink">Manada</text><text x="92" y="63" class="sub">COMPARTE</text></g><g transform="translate(130 375)"><rect class="node" width="220" height="90" rx="6"/><image href="logos/leones-stats.svg" x="14" y="12" width="64" height="64"/><text x="92" y="44" class="ink">Stats</text><text x="92" y="63" class="sub">AGREGA</text></g><g transform="translate(450 245)"><rect class="hub" width="300" height="70" rx="8"/><text x="150" y="286" text-anchor="middle" class="ink">LEONES · conocimiento colectivo</text></g><text x="600" y="520" text-anchor="middle" class="note">Línea continua = flujo operativo · línea discontinua = write-back de conocimiento/evidencia.</text></svg>