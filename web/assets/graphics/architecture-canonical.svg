<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Arquitectura canónica LEONES</title><desc id="desc">Prospector descubre, Atlas conserva conocimiento, Router decide, Agents actúan, Runtime ejecuta, Benchmark mide, Manada comparte y Stats devuelve aprendizaje al sistema.</desc><defs><style>.paper{fill:#f5f5f5}.node{fill:#fff;stroke:#2d3142;stroke-width:1.2}.focal{fill:rgba(235,108,54,.08);stroke:#eb6c36;stroke-width:1.2}.store{fill:rgba(45,49,66,.05);stroke:#4f5d75;stroke-width:1}.ink{font-family:Arial,sans-serif;font-weight:600;font-size:16px;fill:#2d3142}.sub{font-family:Arial,sans-serif;font-size:10px;letter-spacing:.08em;fill:#4f5d75}.arrow{stroke:#4f5d75;stroke-width:1.2;fill:none;marker-end:url(#arrow)}.accentArrow{stroke:#eb6c36;stroke-width:1.4;fill:none;marker-end:url(#arrowAccent)}.note{font-family:Arial,sans-serif;font-size:12px;font-style:italic;fill:#4f5d75}</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#4f5d75"/></marker><marker id="arrowAccent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#eb6c36"/></marker></defs><rect class="paper" width="1200" height="620"/><text x="48" y="48" class="sub">LEONES · ARQUITECTURA</text><text x="48" y="80" class="ink" style="font-size:28px">Del descubrimiento a la evidencia</text><text x="48" y="102" class="note">Cada capa tiene una responsabilidad; la evidencia vuelve a alimentar el sistema.</text><path class="accentArrow" d="M270 190H330"/><path class="arrow" d="M550 190H610"/><path class="arrow" d="M830 190H890"/><path class="arrow" d="M1000 240V300H840V340"/><path class="arrow" d="M840 420V465H660"/><path class="arrow" d="M440 420V465H540"/><path class="arrow" d="M540 525H420V565H270V525"/><path class="accentArrow" d="M660 525H780V565H930V525"/><g transform="translate(50 140)"><rect class="focal" width="220" height="100" rx="6"/><image href="logos/leones-prospection.svg" x="16" y="16" width="68" height="68"/><text x="98" y="50" class="ink">Prospector</text><text x="98" y="70" class="sub">DESCUBRE</text></g><g transform="translate(330 140)"><rect class="node" width="220" height="100" rx="6"/><image href="logos/leones-atlas.svg" x="16" y="16" width="68" height="68"/><text x="98" y="50" class="ink">Atlas</text><text x="98" y="70" class="sub">CONOCE</text></g><g transform="translate(610 140)"><rect class="node" width="220" height="100" rx="6"/><image href="logos/leones-router.svg" x="16" y="16" width="68" height="68"/><text x="98" y="50" class="ink">Router</text><text x="98" y="70" class="sub">DECIDE</text></g><g transform="translate(890 140)"><rect class="node" width="220" height="100" rx="6"/><image href="logos/leones-agents.svg" x="16" y="16" width="68" height="68"/><text x="98" y="50" class="ink">Agents</text><text x="98" y="70" class="sub">ACTÚA</text></g><g transform="translate(730 340)"><rect class="node" width="220" height="80" rx="6"/><image href="logos/leones-hardware.svg" x="14" y="12" width="56" height="56"/><text x="84" y="44" class="ink">Runtime</text><text x="84" y="63" class="sub">EJECUTA</text></g><g transform="translate(330 340)"><rect class="node" width="220" height="80" rx="6"/><image href="logos/leones-evidencia.svg" x="14" y="12" width="56" height="56"/><text x="84" y="44" class="ink">Benchmark</text><text x="84" y="63" class="sub">MIDE · EVIDENCIA</text></g><g transform="translate(330 465)"><rect class="store" width="220" height="80" rx="6"/><image href="logos/leones-manada.svg" x="14" y="12" width="56" height="56"/><text x="84" y="44" class="ink">Manada</text><text x="84" y="63" class="sub">COMPARTE</text></g><g transform="translate(660 465)"><rect class="store" width="220" height="80" rx="6"/><image href="logos/leones-stats.svg" x="14" y="12" width="56" height="56"/><text x="84" y="44" class="ink">Stats</text><text x="84" y="63" class="sub">APRENDE</text></g><text x="600" y="590" text-anchor="middle" class="note">La Manada aporta datos agregados → Stats → Atlas / Router · la evidencia nueva vuelve a Prospector.</text></svg>