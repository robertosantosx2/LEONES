version: 1
name: LEONES Prospection Source Registry
purpose: >-
  Central registry of public software forges and federated code-hosting
  platforms to be consumed by daily prospection bots. Discovery and
  publication remain separate stages.

policy:
  active_by_default: true
  public_sources_only: true
  license_gate_before_publication: true
  deduplicate_by_canonical_repository: true
  retain_source_evidence: true

sources:
  - id: github
    name: GitHub
    host: github.com
    type: forge
    protocol: api
    active: true
  - id: codeberg
    name: Codeberg
    host: codeberg.org
    type: forge
    protocol: api
    active: true
  - id: disroot_forge
    name: Disroot Forge
    host: forge.disroot.org
    type: forgejo
    protocol: api
    active: true
  - id: framagit
    name: Framagit
    host: framagit.org
    type: gitlab
    protocol: api
    active: true
  - id: sourcehut
    name: SourceHut
    host: sourcehut.org
    type: forge
    protocol: api
    active: true
  - id: gnu_savannah
    name: GNU Savannah
    host: savannah.gnu.org
    type: forge
    protocol: web
    active: true
  - id: gnome_gitlab
    name: GNOME GitLab
    host: gitlab.gnome.org
    type: gitlab
    protocol: api
    active: true
  - id: kde_invent
    name: KDE Invent
    host: invent.kde.org
    type: gitlab
    protocol: api
    active: true
  - id: freedesktop_gitlab
    name: Freedesktop.org GitLab
    host: gitlab.freedesktop.org
    type: gitlab
    protocol: api
    active: true
  - id: notabug
    name: NotABug
    host: notabug.org
    type: gitea
    protocol: api
    active: true
  - id: codeberg_test_forgejo
    name: Codeberg-test / Forgejo instances
    host: forgejo
    type: forgejo-federated
    protocol: api
    active: true
    discovery: federation
  - id: forgejo
    name: Forgejo
    host: forgejo.org
    type: platform
    protocol: web
    active: true
  - id: gitea
    name: Gitea
    host: gitea.io
    type: platform
    protocol: web
    active: true
  - id: gitlab_ce
    name: GitLab CE
    host: about.gitlab.com
    type: platform
    protocol: api
    active: true
  - id: gogs
    name: Gogs
    host: gogs.io
    type: platform
    protocol: web
    active: true
  - id: onedev
    name: OneDev
    host: onedev.io
    type: platform
    protocol: web
    active: true
  - id: sourcehut_srht
    name: SourceHut sr.ht
    host: sr.ht
    type: forge
    protocol: api
    active: true
  - id: pagure
    name: Pagure
    host: pagure.io
    type: forge
    protocol: api
    active: true
  - id: kallithea
    name: Kallithea
    host: kallithea-scm.org
    type: platform
    protocol: web
    active: true
  - id: phorge
    name: Phabricator / Phorge
    host: phorge.it
    type: phorge
    protocol: web
    active: true
  - id: fossil
    name: Fossil SCM
    host: fossil-scm.org
    type: scm
    protocol: web
    active: true
  - id: rhodecode
    name: RhodeCode
    host: rhodecode.com
    type: platform
    protocol: web
    active: true
  - id: cgit
    name: CGit
    host: git.zx2c4.com/cgit
    type: cgit
    protocol: web
    active: true
  - id: gitbucket
    name: GitBucket
    host: gitbucket.github.io
    type: platform
    protocol: web
    active: true

# The registry intentionally includes platforms as well as concrete public
# instances. Concrete instance discovery is a separate task and must retain
# the discovered hostname as evidence before it becomes an active source.
