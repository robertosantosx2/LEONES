[package]
name = "kinetic-ktc"
description = "The .ktc model format: reader, writer, verification and converters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
blake3 = { version = "1.8.7", features = ["rayon"] }
ed25519-dalek = "2.2.0"
kinetic-gguf = { path = "../kinetic-gguf" }
memmap2.workspace = true
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[dev-dependencies]
getrandom = "0.3.4"
kinetic-tokenizer = { path = "../kinetic-tokenizer" }
