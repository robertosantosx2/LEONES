name: PyPI

# Uploads the wheels of a release once a maintainer publishes it, so nothing
# reaches PyPI before the release itself is reviewed.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release whose wheels to upload
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Wheels from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ inputs.tag || github.ref_name }}" --pattern "*.whl" --dir dist
      - name: llama-cpp-kinetic
        run: |
          pip install build
          python -m build bindings/llama-cpp-kinetic --outdir dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
