# Catches platform link errors before a release tag: the Windows build only ran on tags (issue #21).
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: -C target-cpu=x86-64-v3
      CARGO_PROFILE_RELEASE_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup update stable
      - run: cargo build --release --locked
