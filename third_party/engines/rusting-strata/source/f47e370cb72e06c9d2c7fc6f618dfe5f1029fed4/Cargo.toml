[package]
name = "rusting_strata"
version = "1.2.1"
edition = "2024"
license-file = "LICENSE.md"

[[bin]]
name = "rustingstrata"
path = "src/main.rs"

[dependencies]
anyhow = "1"
memmap2 = "0.9"
rayon = "1"
half = "2"
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
cudarc = { version = "0.19", default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-13010"] }
ash = "0.38"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[profile.release]
opt-level = 3
debug = 1
codegen-units = 1
lto = "thin"

[profile.test]
opt-level = 3
