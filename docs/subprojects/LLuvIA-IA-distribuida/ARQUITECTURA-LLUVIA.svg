<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
<title id="title">LEONES / LLuvIA — arquitectura distribuida especializada</title><desc id="desc">Propuesta conceptual con gateway, nodo raíz Distributed Llama opcional, diez roles de servicio, almacenamiento, red y observabilidad. No validada físicamente.</desc>
<defs><style>text{font-family:Arial,sans-serif;fill:#12233f}.h1{font-size:34px;font-weight:750}.sub{font-size:18px;fill:#405575}.head{font-size:20px;font-weight:700}.body{font-size:15px}.small{font-size:13px}.panel{fill:#fff;stroke:#b8c9df;stroke-width:1.5}.control{fill:#f1edff;stroke:#7958d8;stroke-width:2}.root{fill:#eaf6ff;stroke:#2386c8;stroke-width:2}.svc{fill:#f0fbf8;stroke:#219b83;stroke-width:1.5}.infra{fill:#fff7e8;stroke:#df9b28;stroke-width:1.5}.line{stroke:#2d5b91;stroke-width:2.2;fill:none}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2d5b91"/></marker></defs>
<rect width="1600" height="1050" fill="#f6f9fd"/><text x="800" y="52" text-anchor="middle" class="h1">LEONES · LLuvIA</text><text x="800" y="82" text-anchor="middle" class="sub">Arquitectura de IA distribuida especializada — propuesta de referencia</text>
<rect x="45" y="115" width="260" height="150" rx="14" class="panel"/><text x="68" y="148" class="head">Clientes</text><text x="68" y="178" class="body">• Chat / Web / API</text><text x="68" y="204" class="body">• Aplicaciones y agentes</text><text x="68" y="230" class="body">• Móvil y automatizaciones</text>
<rect x="350" y="115" width="900" height="200" rx="16" class="control"/><text x="380" y="151" class="head">Máquina 1 · Gateway LLuvIA</text><text x="380" y="178" class="body">API unificada · políticas · autenticación · cuotas · selección de motor · fallback</text>
<rect x="380" y="198" width="195" height="88" rx="10" class="panel"/><text x="397" y="224" font-weight="700" font-size="15">Router de IA</text><text x="397" y="247" class="small">Intención y destino</text><text x="397" y="267" class="small">Carga y disponibilidad</text>
<rect x="592" y="198" width="195" height="88" rx="10" class="panel"/><text x="609" y="224" font-weight="700" font-size="15">API Gateway</text><text x="609" y="247" class="small">REST / WebSocket</text><text x="609" y="267" class="small">Autorización y límites</text>
<rect x="804" y="198" width="195" height="88" rx="10" class="panel"/><text x="821" y="224" font-weight="700" font-size="15">Observabilidad</text><text x="821" y="247" class="small">Logs, métricas, trazas</text><text x="821" y="267" class="small">Salud y alertas</text>
<rect x="1016" y="198" width="204" height="88" rx="10" class="panel"/><text x="1033" y="224" font-weight="700" font-size="15">Catálogo de modelos</text><text x="1033" y="247" class="small">Versiones y formatos</text><text x="1033" y="267" class="small">Distribución controlada</text>
<rect x="1290" y="115" width="265" height="150" rx="14" class="infra"/><text x="1313" y="148" class="head">Infraestructura</text><text x="1313" y="178" class="body">• Modelos y artefactos</text><text x="1313" y="204" class="body">• Logs y configuración</text><text x="1313" y="230" class="body">• Copias de seguridad</text>
<path d="M305 190 H350 M1250 220 H1290" class="line" marker-end="url(#arrow)"/>
<rect x="350" y="355" width="900" height="160" rx="16" class="root"/><text x="380" y="390" class="head">Máquina 2 · Nodo raíz Distributed Llama (opcional / experimental)</text><text x="380" y="416" class="body">Coordina inferencia en clúster; no reemplaza el gateway ni el enrutamiento de LLuvIA.</text>
<rect x="380" y="435" width="260" height="58" rx="9" class="panel"/><text x="397" y="458" font-weight="700" font-size="15">Servidor raíz</text><text x="397" y="479" class="small">Carga y coordinación del modelo</text>
<rect x="660" y="435" width="260" height="58" rx="9" class="panel"/><text x="677" y="458" font-weight="700" font-size="15">Artefacto compatible</text><text x="677" y="479" class="small">Formato DL; versión fijada</text>
<rect x="940" y="435" width="280" height="58" rx="9" class="panel"/><text x="957" y="458" font-weight="700" font-size="15">Workers del clúster</text><text x="957" y="479" class="small">Red y sincronización</text>
<path d="M800 315 V355 M305 435 H350" class="line" marker-end="url(#arrow)"/><text x="815" y="340" class="small">solicitudes elegibles</text>
<rect x="45" y="355" width="260" height="160" rx="14" class="panel"/><text x="68" y="390" class="head">Red local</text><text x="68" y="420" class="body">Ethernet recomendado</text><text x="68" y="447" class="body">DNS / TLS / cortafuegos</text><text x="68" y="474" class="body">Segmentación por servicio</text>
<path d="M800 515 V555" class="line" marker-end="url(#arrow)"/><text x="815" y="542" class="small">API / tareas especializadas</text><text x="45" y="585" class="head">Nodos de servicio — topología orientativa, agrupable según mediciones</text>
<g><rect x="45" y="610" width="285" height="135" rx="12" class="svc"/><text x="65" y="641" class="head">Máquina 3 · Código</text><text x="65" y="670" class="body">CPU / 16–32 GB RAM*</text><text x="65" y="696" class="body">Generación, depuración, tests</text><text x="65" y="722" class="small">Modelo coder validado</text>
<rect x="350" y="610" width="285" height="135" rx="12" class="svc"/><text x="370" y="641" class="head">Máquina 4 · Idiomas</text><text x="370" y="670" class="body">CPU / 16 GB RAM*</text><text x="370" y="696" class="body">Traducción, resumen, texto</text><text x="370" y="722" class="small">Evaluación por idioma</text>
<rect x="655" y="610" width="285" height="135" rx="12" class="svc"/><text x="675" y="641" class="head">Máquina 5 · Matemáticas</text><text x="675" y="670" class="body">CPU / 16 GB RAM*</text><text x="675" y="696" class="body">Cálculo + Python / SymPy</text><text x="675" y="722" class="small">Verificación determinista</text>
<rect x="960" y="610" width="285" height="135" rx="12" class="svc"/><text x="980" y="641" class="head">Máquina 6 · Visión / OCR</text><text x="980" y="670" class="body">CPU; GPU opcional*</text><text x="980" y="696" class="body">Documentos e imágenes</text><text x="980" y="722" class="small">VLM y OCR por separado</text>
<rect x="1265" y="610" width="290" height="135" rx="12" class="svc"/><text x="1285" y="641" class="head">Máquina 7 · Audio</text><text x="1285" y="670" class="body">CPU / 16 GB RAM*</text><text x="1285" y="696" class="body">ASR, transcripción</text><text x="1285" y="722" class="small">Español por validar</text>
<rect x="45" y="765" width="285" height="110" rx="12" class="svc"/><text x="65" y="795" class="head">Máquina 8 · TTS</text><text x="65" y="823" class="body">Síntesis de voz local</text><text x="65" y="848" class="small">Voces/licencias por validar</text>
<rect x="350" y="765" width="285" height="110" rx="12" class="svc"/><text x="370" y="795" class="head">Máquina 9 · Vídeo</text><text x="370" y="823" class="body">FFmpeg + fotogramas</text><text x="370" y="848" class="small">No implica comprensión temporal plena</text>
<rect x="655" y="765" width="285" height="110" rx="12" class="svc"/><text x="675" y="795" class="head">Máquina 10 · RAG</text><text x="675" y="823" class="body">Embeddings + Qdrant</text><text x="675" y="848" class="small">Índice y documentos locales</text>
<rect x="960" y="765" width="285" height="110" rx="12" class="svc"/><text x="980" y="795" class="head">Máquina 11 · Chat</text><text x="980" y="823" class="body">Modelo de texto compacto</text><text x="980" y="848" class="small">Servicio general / fallback</text>
<rect x="1265" y="765" width="290" height="110" rx="12" class="svc"/><text x="1285" y="795" class="head">Máquina 12 · Reserva</text><text x="1285" y="823" class="body">Pruebas / réplica / nuevos</text><text x="1285" y="848" class="small">No requiere diez hosts físicos</text></g>
<path d="M800 555 V590 H187 V610 M800 590 H492 V610 M800 590 H797 V610 M800 590 H1102 V610 M800 590 H1410 V610 M800 590 V750 H187 V765 M800 750 H492 V765 M800 750 H797 V765 M800 750 H1102 V765 M800 750 H1410 V765" class="line" marker-end="url(#arrow)"/>
<rect x="45" y="900" width="1510" height="112" rx="14" class="panel"/><text x="70" y="932" class="head">Flujo de petición</text><text x="70" y="960" class="body">1. Cliente → gateway · 2. Clasificación y políticas · 3. Servicio especialista o clúster opcional · 4. Respuesta unificada · 5. Métricas y trazas</text><text x="70" y="987" class="small">* RAM, GPU, modelos y número de máquinas son perfiles de referencia, no inventario confirmado. Las RAM no se suman como memoria unificada.</text><text x="800" y="1035" text-anchor="middle" font-size="13" font-weight="700" fill="#9a4b16">ESTADO: PROPUESTA DOCUMENTAL · No desplegada ni validada físicamente · Qwen3.5 / LFM3 requieren pruebas</text></svg>