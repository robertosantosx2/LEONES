# ODS — Strata NVIDIA GPU overlay (skeleton for PR C)
# Copy to: extensions/services/strata/compose.nvidia.yaml
#
# Merged when GPU backend is nvidia, e.g.:
#   docker compose -f docker-compose.base.yml \
#     -f docker-compose.nvidia.yml \
#     -f extensions/services/strata/compose.yaml \
#     -f extensions/services/strata/compose.nvidia.yaml up -d strata

services:
  strata:
    # If building from upstream Dockerfile at a pinned commit instead of a prebuilt image:
    # build:
    #   context: https://github.com/Niko1221/Strata.git#<FULL_COMMIT>
    #   dockerfile: Dockerfile
    #   args:
    #     CUDA_ARCHITECTURES: ${STRATA_CUDA_ARCHITECTURES:-75;80;86;89;120}
    #     BUILD_VISION: ${STRATA_BUILD_VISION:-1}
    # image: ods-strata:<FULL_COMMIT>
    # pull_policy: never

    gpus: all
    # Prefer discrete device requests if the ODS nvidia overlay standard uses them:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
